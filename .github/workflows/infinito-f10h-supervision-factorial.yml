name: INFINITO F10-H - New-World Supervision Factorial

on:
  push:
    branches: [experiment/f10h-four-way-supervision-factorial]
    paths:
      - docs/INFINITO_F10H_LAUNCH.md

permissions:
  contents: read
  actions: read

concurrency:
  group: f10h-new-19100000-supervision-factorial
  cancel-in-progress: false

jobs:
  train-and-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    strategy:
      fail-fast: false
      matrix:
        index: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU-only deterministic inference/training dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy
      - name: Preflight TESTS and frozen previous model before TRAIN or DEV/OOD
        run: |
          python -m unittest discover -s tests -p 'test_f10h_supervision_factorial.py' -v
          python -m py_compile observatory/f10h_worlds.py observatory/f10h_experiment.py observatory/f10h_audit.py
          git diff --exit-code a11f525af2acf42769962d4ec6b95468526a3ece -- observatory/f10g_models.py observatory/f10g_worlds.py observatory/f10g_experiment.py
      - name: Train all 5 same-world arms BEFORE generating independent DEV/OOD
        run: |
          set -o pipefail
          python -m observatory.f10h_experiment --index ${{ matrix.index }} --output f10h-out/${{ matrix.index }} | tee f10h-training-${{ matrix.index }}.log
      - name: Contract audit per frozen replica with exact SHA and seeds
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          i=int("${{ matrix.index }}")
          p=Path(f"f10h-out/{i}")
          train=json.loads((p/"training.json").read_text())
          rows=json.loads((p/"rows.json").read_text())
          assert train["replica"]==i and train["stage"]=="TRAIN_COMPLETED_BEFORE_DEV_OR_OOD"
          assert set(train["arms"])=={"joint","selection_only","interpretation_only","both","gru_only"}
          assert len(train["train_hashes"])==2048
          assert len(rows)==5*2*128*4
          for arm,meta in train["arms"].items():
              assert meta["steps"]==640 and meta["examples"]==40960
              assert hashlib.sha256((p/(arm+".pt")).read_bytes()).hexdigest()==meta["sha256"]
          for split,base in (("dev",19200000),("ood",19400000)):
              group=[r for r in rows if r["split"]==split and r["arm"]=="both"]
              assert len(group)==512
              assert {r["seed"] for r in group}==set(range(base+10000*i,base+10000*i+128))
              assert all(r["signed_count"]>=4 and r["signed_value_changes"]>=3 for r in group)
          print("F10H_FROZEN_REPLICA_ARTIFACT_COMPLETE",i,flush=True)
          PY
      - name: Preserve original checkpoints, metadata, all rows and training log
        if: always()
        run: |
          if test -d f10h-out/${{ matrix.index }}; then
            cp f10h-training-${{ matrix.index }}.log f10h-out/${{ matrix.index }}/run.log || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f10h-actor-${{ matrix.index }}
          path: f10h-out/${{ matrix.index }}/
          retention-days: 75
          if-no-files-found: warn

  independent-scientific-audit:
    needs: train-and-freeze
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: f10h-actor-*
          path: gathered
      - name: Verify every SHA, every TRAIN/DEV/OOD world and original preregistered gates
        run: |
          for i in 0 1 2 3; do
            mkdir -p audited/$i
            cp gathered/f10h-actor-$i/* audited/$i/
          done
          python -m observatory.f10h_audit --root audited --output f10h-audit.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path("f10h-audit.json").read_text())
          assert r["technical"]=="F10H_TECHNICAL_COMPLETE"
          assert r["unique_state_hashes"]==12288
          assert not r["confirm_19300000_opened"] and not r["old_training_used"]
          lines=[
            "# INFINITO F10-H — four-way supervision and multi-version updates",
            "New 19100000 TRAIN, 19200000 DEV, 19400000 OOD namespaces; 19300000 CONFIRM sealed.",
            "Four replicas, five same-budget arms, >=4 signed versions per case, three or more signed value changes.",
            "## Preregistered scientific outcome: "+r["status"],
            "Gate counts: "+str(r["gate_replica_counts"]),
            "",
            "| Replica | joint | selection only | interpretation only | both | GRU only | selection effect | interpretation effect | complementarity |",
            "|---|---:|---:|---:|---:|---:|---:|---:|---:|"
          ]
          for i,v in r["replicas"].items():
              m=v["metrics"]["ood"];c=v["contrasts"]
              lines.append(
                  "| "+i+" | "+" | ".join(f'{m[a]["read"]*100:.2f}%' for a in
                   ("joint","selection_only","interpretation_only","both","gru_only"))+
                  f' | {c["selection_effect"]["delta"]*100:+.1f} pp | {c["interpretation_effect"]["delta"]*100:+.1f} pp | {c["both_vs_best_single"]["delta"]*100:+.1f} pp |')
          lines+=["","## Complete stratified OOD/DEV and bootstrap results",
                  "~~~json",json.dumps(r["replicas"],indent=2,ensure_ascii=False),"~~~",
                  "**Technical success is not scientific success. Original TRAIN + OOD stored in artifacts and no confirmation opened.**"]
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(lines))
          print("F10H_FIXED_SCIENTIFIC_STATUS",r["status"],r["gates"],flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: f10h-independent-preregistered-audit
          path: f10h-audit.json
          retention-days: 75
          if-no-files-found: error
