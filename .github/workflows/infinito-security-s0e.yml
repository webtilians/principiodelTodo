name: INFINITO Security S0-E authenticated evidence provenance

on:
  push:
    branches: ["experiment/security-s0e-provenance-verifier-20261109"]
    paths:
      - "security_lab/evidence_provenance.py"
      - "security_lab/s0e.py"
      - "tests/test_security_lab_s0e.py"
      - "docs/INFINITO_SECURITY_S0E_PROTOCOL_2026-11-09.md"
      - ".github/workflows/infinito-security-s0e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s0e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the real MCP and sealed-memory dependencies
        run: python -m pip install -q pytest "mcp>=2,<3" "cryptography>=42" "pykeepass>=4.1,<5"
      - name: Check S0-E new provenance contracts and earlier security regressions
        run: |
          python -m pytest -q \
            tests/test_security_lab_s0.py \
            tests/test_security_lab_s0b.py \
            tests/test_security_lab_s0c.py \
            tests/test_security_lab_s0d.py \
            tests/test_security_lab_s0e.py
      - name: Compile source code
        run: python -m compileall -q security_lab

  inference:
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Retrieve frozen public GGUF (ephemeral runner)
        id: gguf
        run: |
          python -m pip install -q huggingface_hub==0.29.3
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from huggingface_hub import hf_hub_download
          path = hf_hub_download(
              "bartowski/Qwen2.5-7B-Instruct-GGUF",
              "Qwen2.5-7B-Instruct-Q4_K_M.gguf",
              revision="8911e8a47f92bac19d6f5c64a2e2095bd2f7d031",
          )
          print("model_path=" + path)
          PY
      - name: Build offline container with S0-E
        run: docker build -f security_lab/Dockerfile.s0c -t infinito-security-s0e .
      - name: Run on isolated OAuth/MCP clone without external network
        env:
          MODEL_PATH: ${{ steps.gguf.outputs.model_path }}
        run: |
          set -euo pipefail
          mkdir -p s0e_artifacts
          docker run --rm \
            --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 128 --memory 6500m --cpus 4 \
            --tmpfs /tmp:rw,nosuid,size=256m,mode=1777 \
            --mount "type=bind,src=${MODEL_PATH},dst=/models/model.gguf,readonly" \
            --entrypoint /bin/sh infinito-security-s0e -c '
              python -m security_lab.s0e --out /tmp/s0e_artifacts
              code=$?
              echo S0E_JSON_REPORT_BEGIN
              cat /tmp/s0e_artifacts/report.json 2>/dev/null || cat /tmp/s0e_artifacts/blocked.json
              echo S0E_JSON_REPORT_END
              exit "$code"
            ' 2>&1 | tee s0e_artifacts/console.log
      - name: Extract sanitized JSON output
        if: always()
        run: |
          if test -f s0e_artifacts/console.log; then
            awk '/^S0E_JSON_REPORT_BEGIN$/{f=1;next} /^S0E_JSON_REPORT_END$/{f=0} f{print}' \
              s0e_artifacts/console.log > s0e_artifacts/report.json
          fi
      - name: Preserve synthetic-only results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infinito-security-s0e-provenance-frozen-7b
          path: s0e_artifacts/
          retention-days: 30
          if-no-files-found: warn
