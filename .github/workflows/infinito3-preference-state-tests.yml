name: INFINITO 3.0 Preference State Tests

on:
  push:
    branches: [feat/preference-state-retrieval-20260914]
    paths:
      - '.github/workflows/infinito3-preference-state-tests.yml'
      - 'src/infinito3/preference_context.py'
      - 'src/infinito3/semantic_temporal_state.py'
      - 'tests/test_preference_context_v3.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Full deterministic INFINITO 3.0 tests
        run: python -m pytest tests/test_*v3.py -q
