name: INFINITO F9-I verify completed artifacts
on:
  push:
    branches: ["experiment/f9i-selective-event-memory"]
    paths:
      - "observatory/f9i_aggregate.py"
      - ".github/workflows/infinito-f9i-verify.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: f9i-*
          run-id: 40928547873
          github-token: ${{ github.token }}
          path: archives
      - name: Validate preassigned cells and reproduce F9-H
        env:
          EXPECTED_SOURCE_SHA: e5fd56ab794e77dbe680bec14ce8a5a276682da3
        run: python -m observatory.f9i_aggregate
      - uses: actions/upload-artifact@v4
        with:
          name: f9i-verified-results
          path: |
            f9i_results.json
            f9i_results.md
          if-no-files-found: error
          retention-days: 30
