name: INFINITO DSE-2 real-LLM verified-evidence exploratory pilot
on:
  pull_request:
    branches: [master]
    paths:
      - docs/INFINITO_DSE2_VERIFIED_EVIDENCE_PREREG_2026-11-16.md
      - observatory/dse2_verified_experiences.py
      - tests/test_dse2_verified_evidence_v3.py
      - .github/workflows/infinito-dse2-verified-evidence.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    name: Isolated provenance and verification contracts
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_dse2_verified_evidence_v3.py
  real-frozen-qwen:
    name: Three-arm Qwen 1.5B CPU exploratory evaluation
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned free CPU inference stack
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.48.3 sentencepiece==0.2.0
      - name: Run real-model heldout A/B/C test (no paid API)
        run: python -m observatory.dse2_verified_experiences --out dse2_artifacts
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dse2-qwen05b-realmodel-results
          path: dse2_artifacts/
          if-no-files-found: warn
          retention-days: 14
