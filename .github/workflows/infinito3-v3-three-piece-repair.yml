name: INFINITO 3.0 Frozen V3 Three-Piece Repair

on:
  push:
    branches: [feat/semantic-events-structured-retrieval-20260914]
    paths:
      - '.github/infinito3-v3-three-piece-repair-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install openai pytest
      - name: Deterministic tests before paid run
        run: python -m pytest tests/test_*v3.py -q
      - name: Frozen V3 three-piece repair
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: >-
          python scripts/run_infinito3_v3_three_piece_repair.py
          --model gpt-5.6-luna
          --reasoning-effort none
          --embedding-provider openai
          --embedding-model text-embedding-3-small
          --semantic-reranker llm
          --reranker-model gpt-5.6-luna
          --event-model gpt-5.6-luna
          --planner-model gpt-5.6-luna
          --output-dir trajectory-v3-three-piece-repair-results
      - name: Summary
        if: always()
        run: |
          if [ -d trajectory-v3-three-piece-repair-results ]; then
            find trajectory-v3-three-piece-repair-results -name '*.md' -exec cat {} \; >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infinito3-v3-three-piece-repair
          path: trajectory-v3-three-piece-repair-results/
          if-no-files-found: warn
          retention-days: 30
