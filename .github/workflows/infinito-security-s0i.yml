name: INFINITO Security S0-I frozen Qwen7B episodic learning vs lookup

on:
  push:
    branches: ["experiment/security-s0i-mcp-episodic-adaptation-20261109"]
    paths:
      - "security_lab/s0i.py"
      - "tests/test_security_lab_s0i.py"
      - "docs/INFINITO_SECURITY_S0I_*"
      - ".github/workflows/infinito-security-s0i.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s0i-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies for real SQLite and OAuth/MCP contract checks
        run: python -m pip install -q pytest "mcp>=2,<3" "cryptography>=42" "pykeepass>=4.1,<5"
      - name: Validate new preregistered S0-I and earlier S0-A to H suites
        run: |
          python -m pytest -q -rx \
            tests/test_security_lab_s0.py \
            tests/test_security_lab_s0b.py \
            tests/test_security_lab_s0c.py \
            tests/test_security_lab_s0d.py \
            tests/test_security_lab_s0e.py \
            tests/test_security_lab_s0f.py \
            tests/test_security_lab_s0g_review.py \
            tests/test_security_lab_s0h.py \
            tests/test_security_lab_s0i.py
      - name: Validate source is parseable
        run: python -m compileall -q security_lab/s0i.py tests/test_security_lab_s0i.py

  inference:
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download exactly the previous frozen Qwen2.5-7B GGUF
        id: gguf
        run: |
          python -m pip install -q huggingface_hub==0.29.3
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from huggingface_hub import hf_hub_download
          model = hf_hub_download(
              "bartowski/Qwen2.5-7B-Instruct-GGUF",
              "Qwen2.5-7B-Instruct-Q4_K_M.gguf",
              revision="8911e8a47f92bac19d6f5c64a2e2095bd2f7d031",
          )
          print("model_path=" + model)
          PY
      - name: Build isolated real OAuth MCP 7B container
        run: docker build -f security_lab/Dockerfile.s0c -t infinito-security-s0i .
      - name: Execute 24 PILOT cases; only run 48 held-out CONFIRM if pilot gate passes
        env:
          MODEL_PATH: ${{ steps.gguf.outputs.model_path }}
        run: |
          set -euo pipefail
          mkdir -p s0i_artifacts
          docker run --rm \
            --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 128 --memory 6500m --cpus 4 \
            --tmpfs /tmp:rw,nosuid,size=256m,mode=1777 \
            --mount "type=bind,src=${MODEL_PATH},dst=/models/model.gguf,readonly" \
            --entrypoint /bin/sh infinito-security-s0i -c '
              python -m security_lab.s0i --out /tmp/s0i_artifacts
              code=$?
              echo S0I_JSON_REPORT_BEGIN
              cat /tmp/s0i_artifacts/report.json 2>/dev/null || cat /tmp/s0i_artifacts/blocked.json
              echo S0I_JSON_REPORT_END
              exit "$code"
            ' 2>&1 | tee s0i_artifacts/console.log
      - name: Extract report without OAuth credentials or raw memory
        if: always()
        run: |
          if test -f s0i_artifacts/console.log; then
            awk '/^S0I_JSON_REPORT_BEGIN$/{f=1;next} /^S0I_JSON_REPORT_END$/{f=0} f{print}' \
              s0i_artifacts/console.log > s0i_artifacts/report.json
          fi
      - name: Upload synthetic report and model/gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infinito-security-s0i-frozen-7b
          path: s0i_artifacts/
          retention-days: 30
          if-no-files-found: warn
