name: INFINITO F10-N - Frozen Artifact Audit-Only Technical Correction

on:
  push:
    branches: [experiment/f10n-explicit-experience-effect-memory]
    paths: [docs/INFINITO_F10N_AUDIT_ONLY_LAUNCH.md]

permissions:
  contents: read
  actions: read

concurrency:
  group: f10n-frozen-41714113859-audit-only
  cancel-in-progress: false

jobs:
  audit_original_frozen_artifacts_only:
    name: Reconstruct original trial logs, no training/evaluation, fixed G0-G4
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ONLY NumPy for statistical audit
        run: python -m pip install numpy
      - name: Prove all original experiments and preregistration unchanged
        run: |
          git diff --exit-code 2ea33e63cab5af7b781c35a9c349224e30a7e7f9 -- \
            observatory/f10n_worlds.py observatory/f10n_memory.py \
            observatory/f10n_experiment.py tests/test_f10n_explicit_experience_memory.py \
            docs/INFINITO_F10N_EXPERIENCE_EFFECT_MEMORY_PREREG_2026-11-03.md \
            src/infinito3
          python -m py_compile observatory/f10n_audit.py
      - name: Download 4 ORIGINAL original frozen F10-N artifact bundles from exact run 41714113859
        uses: actions/download-artifact@v4
        with:
          repository: webtilians/principiodelTodo
          run-id: 41714113859
          github-token: ${{ github.token }}
          pattern: f10n-original-experience-*
          path: original-frozen
      - name: Download ORIGINAL F10-L checkpoint SHA manifest from original run 41685499939
        uses: actions/download-artifact@v4
        with:
          repository: webtilians/principiodelTodo
          run-id: 41685499939
          github-token: ${{ github.token }}
          name: f10l-independent-g0-original
          path: original-g0
      - name: Re-audit original 786432 realized trials and original 20480 frozen predictions
        run: |
          for i in 0 1 2 3; do
            mkdir -p independently-audited/$i
            cp original-frozen/f10n-original-experience-$i/* independently-audited/$i/
          done
          python -m observatory.f10n_audit --root independently-audited --original-g0 original-g0/f10l-g0.json --out f10n-original-frozen-science.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          report=json.loads(Path("f10n-original-frozen-science.json").read_text())
          assert report["technical"]=="F10N_TECHNICAL_COMPLETE"
          assert report["unique_case_identity_hashes"]==17408
          assert report["confirm_26300000_unopened"]
          lines=[
             "# INFINITO F10-N — corrected audit on ORIGINAL frozen artifacts only",
             "**Scientific outcome with UNCHANGED gates: "+report["status"]+"**",
             "**Original G0–G4 gate counts: "+str(report["gate_counts"])+"**",
             "Original F10-N models/trials/DEV/OOD from GitHub Actions 41714113859.",
             "Correction to audit ONLY: local g0 boolean renamed g0_pass. No new experiment.",
             "F10-N CONFIRM 26300000+ SEALED.",
             "",
             "| Replica | C DEV PUBLIC0 | C DEV PUBLIC1 | C DEV MEMORY0 | A reward OOD | B additive OOD | C effects OOD | D directed OOD | C OOD top program |",
             "|---|---:|---:|---:|---:|---:|---:|---:|---|",
          ]
          for i,rep in report["replicas"].items():
              dev=rep["metrics"]["dev"]["learned_effects_uniform"]
              ood=rep["metrics"]["ood"]
              vals=[dev["PUBLIC_0"]["accuracy"],dev["PUBLIC_1"]["accuracy"],
                    dev["MEMORY_0"]["accuracy"]]+[
                    ood[a]["accuracy"] for a in (
                       "reward_table","additive_reward_table",
                       "learned_effects_uniform","learned_effects_directed")]
              top=next(iter(ood["learned_effects_uniform"]["program_counts"]))
              lines.append("| "+i+" | "+" | ".join(f"{100*z:.2f}%" for z in vals)+" | "+top+" |")
          lines.extend(["",
             "## Original SHA, transcript integrity, original world-bootstrap intervals and gates",
             "~~~json",json.dumps(report["replicas"],ensure_ascii=False,indent=2),"~~~",
             "TECHNICAL COMPLETE is separate from scientific PASS."
          ])
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(lines))
          print("F10N_FROZEN_ORIGINAL_AUDIT_ONLY",report["status"],report["gate_counts"],flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: f10n-audit-only-original-immutable-results
          path: f10n-original-frozen-science.json
          retention-days: 90
          if-no-files-found: error
