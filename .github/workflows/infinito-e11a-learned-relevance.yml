name: INFINITO E11-A — learned future memory relevance, frozen holdouts

on:
  push:
    branches: [experiment/e11-learned-future-memory-relevance]
    paths:
      - observatory/e11_learned_relevance.py
      - tests/test_e11_learned_relevance.py
      - docs/INFINITO_E11A_LEARNED_RELEVANCE_PROTOCOL.md
      - .github/workflows/infinito-e11a-learned-relevance.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e11a-single-relevance-confirmation
  cancel-in-progress: false

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Confirm frozen production core (not F9 or E10)
        run: |
          git diff --exit-code origin/master -- src/infinito3/
          test -f docs/INFINITO_E11A_LEARNED_RELEVANCE_PROTOCOL.md
          python -m py_compile observatory/e11_learned_relevance.py
      - name: Independent key features, strict memory, no future leakage
        run: python -m pytest -q tests/test_e11_learned_relevance.py
      - name: Original v3 regression tests
        run: python -m pytest -q tests/test_*_v3.py

  training-and-development:
    needs: integrity
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: TRAIN 5 independent learned policies on 2500 episodes each; evaluate DEV only
        run: python -m observatory.e11_learned_relevance --phase train-dev --output e11a-results/training-development
      - name: Freeze five models and check isolated DEV seeds
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("e11a-results/training-development")
          models=json.loads((p/"frozen_models.json").read_text())
          dev=json.loads((p/"dev_report.json").read_text())
          assert models["replicas"]==5
          assert models["train_episodes_per_replica"]==2500
          assert len(models["weights"])==5
          assert all(m["train_examples"]==2500 for m in models["weights"].values())
          assert dev["split"]=="dev" and dev["summary"]["episodes"]==800
          assert len(dev["rows"])==800
          assert all(3200000<=x["seed"]<3250000 for x in dev["rows"])
          assert not any("confirm" in x["seed"].__str__() for x in dev["rows"])
          print("E11A_FROZEN_MODELS_DEV_GATE_SUCCESS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: e11a-five-frozen-learners-and-development
          path: e11a-results/training-development/
          if-no-files-found: error
          retention-days: 45

  independent-confirmation:
    needs: training-and-development
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: e11a-five-frozen-learners-and-development
          path: e11a-results/training-development
      - name: Open 3300000+ ONCE; evaluate predictive, uniform and inverse demand with frozen policies
        run: |
          python -m observatory.e11_learned_relevance \
            --phase confirm \
            --models e11a-results/training-development/frozen_models.json \
            --output e11a-results/confirmation
      - name: Verify prospective 3200 episode × 3-regime matched set, independent training replicas and no oracle leak
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("e11a-results/confirmation")
          r=json.loads((root/"report.json").read_text())
          assert r["split"]=="confirm" and r["independent_training_replicas"]==5
          assert r["confirm_episodes_per_regime"]==3200
          assert r["memory_capacity"]==4 and r["events_per_episode"]==16
          assert r["no_llm"] and r["no_infinito3_core_modified"] and r["no_e10_splits_reused"]
          assert r["oracle_demand_distribution_is_not_given_to_learner"]
          assert set(r["results"])=={"predictive","uniform","reversed"}
          for regime,result in r["results"].items():
              assert result["summary"]["episodes"]==3200
              assert len(result["summary"]["by_replica"])==5
              rows=json.loads((root/f"{regime}_paired_worlds.json").read_text())
              assert len(rows)==3200
              assert all(3300000<=x["seed"]<3350000 for x in rows)
              assert all(x["policies"][name]["saved_count"]==4
                         and x["policies"][name]["memory_capacity_violations"]==0
                         for x in rows for name in x["policies"])
          assert isinstance(r["progress_gate"],bool)
          print("E11A_PROSPECTIVE_CONFIRMED_WITHOUT_PARAMETER_TUNING")
          PY
      - name: Publish all baselines and negative controls, never select favorable outcome
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path("e11a-results/confirmation/report.json").read_text())
          lines=["# INFINITO E11-A — learned relevance for unseen keys",
                 "Five trained selectors independently frozen before confirmation.",
                 "16 events, 4 memory slots, 3200 unseen episodes per regime.",
                 "",
                 "| Policy | Predictive hit / 3200 | Uniform hit / 3200 | Inverted hit /3200 |",
                 "|---|---:|---:|---:|"]
          for policy in r["results"]["predictive"]["summary"]["policies"]:
              values=[r["results"][regime]["summary"]["policies"][policy]["hit"]
                      for regime in ("predictive","uniform","reversed")]
              lines.append(f"| {policy} | {values[0]}/3200 | {values[1]}/3200 | {values[2]}/3200 |")
          lines+=["","## Frozen primary comparisons (bootstrap by 5 training replicates)",
                  json.dumps(r["results"]["predictive"]["contrasts"],indent=2),
                  "",f"**Preregistered advance gate**: {r['progress_gate']}",
                  f"**Negative uniform ideal**: {r['uniform_expected_capacity_rate']*100:.1f}%",
                  f"**Learned minus reservoir on uniform**: {r['uniform_learned_minus_reservoir']*100:+.2f} pp",
                  "",
                  "Scope: retrospective query-feedback learning in a synthetic keyed memory, NOT LLM semantic memory.",
                  "Historical E10 and F9 confirmation splits remain untouched."]
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(lines)+"\n")
          print("E11A_FINAL_OUTCOME",json.dumps({
            "predictive":r["results"]["predictive"]["summary"]["policies"],
            "uniform":r["results"]["uniform"]["summary"]["policies"],
            "reversed":r["results"]["reversed"]["summary"]["policies"],
            "paired_differences":r["results"]["predictive"]["contrasts"],
            "progress_gate":r["progress_gate"]},ensure_ascii=False),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e11a-full-preregistered-prospective-confirmation
          path: e11a-results/confirmation/
          if-no-files-found: warn
          retention-days: 45
