name: INFINITO F12-M causal execution failure diagnostics
on:
  push:
    branches: [experiment/f12m-execution-failure-isolation-20261108]
    paths:
      - observatory/f12m_execution_failure_diagnostic.py
      - tests/test_f12m_execution_failure_diagnostic.py
      - .github/workflows/infinito-f12m-execution-failure.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check frozen novel worlds, no private supervisor, error prefix and fake-only aggregate
        run: python -m unittest tests.test_f12m_execution_failure_diagnostic -v
  pinned-qwen7b-shards:
    needs: contracts
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    timeout-minutes: 100
    env:
      PYTHONHASHSEED: '0'
      HF_HUB_DISABLE_TELEMETRY: '1'
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Qwen7B CPU runtime
        run: |
          python -m pip install --only-binary llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu llama-cpp-python==0.3.36 huggingface_hub==0.29.3
      - name: Evaluate 54 real Qwen7B episodes in this sealed shard
        run: python -m observatory.f12m_execution_failure_diagnostic --shard ${{ matrix.shard }} --out f12m_part
      - name: Preserve raw episode prompts and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f12m-shard-${{ matrix.shard }}
          path: f12m_part/
          if-no-files-found: warn
          retention-days: 45
  aggregate:
    needs: pinned-qwen7b-shards
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: f12m-shard-*
          merge-multiple: true
          path: f12m_parts
      - name: Audit all 216 episodes and frozen gates
        run: python -m observatory.f12m_execution_failure_diagnostic --aggregate-dir f12m_parts --out f12m_full_artifacts
      - name: Publish four-shard scientific audit
        uses: actions/upload-artifact@v4
        with:
          name: f12m-frozen7b-execution-failure-diagnostic
          path: f12m_full_artifacts/
          retention-days: 45
