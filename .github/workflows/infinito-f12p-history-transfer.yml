name: INFINITO F12-P history carryover then cross-family wording
on:
  push:
    branches: [experiment/f12p-order-carryover-new-families-20261109]
    paths:
      - observatory/f12p_order_history_gate.py
      - observatory/f12p_cross_family_wording_transfer.py
      - tests/test_f12p_order_and_transfer.py
      - .github/workflows/infinito-f12p-history-transfer.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify frozen public prompts, two new families, fake-only guards
        run: python -m unittest tests.test_f12p_order_and_transfer -v
  history:
    needs: contracts
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        worker: [0, 1]
    timeout-minutes: 100
    env:
      PYTHONHASHSEED: '0'
      HF_HUB_DISABLE_TELEMETRY: '1'
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned frozen Qwen7B CPU runtime
        run: |
          python -m pip install --only-binary llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu llama-cpp-python==0.3.36 huggingface_hub==0.29.3
      - name: Interleave six exact frozen prompts in three orders, twelve per anchor
        run: python -m observatory.f12p_order_history_gate --worker ${{ matrix.worker }} --out f12p_history_worker
      - name: Preserve histories and raw inferences
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f12p-history-worker-${{ matrix.worker }}
          path: f12p_history_worker/
          if-no-files-found: warn
          retention-days: 45
  history_gate:
    needs: history
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: f12p-history-worker-*
          merge-multiple: true
          path: f12p_history_workers
      - name: Hard gate - 72 real answers must be identical for every repeated prompt
        run: python -m observatory.f12p_order_history_gate --aggregate-dir f12p_history_workers --out f12p_gate
      - name: Preserve audit even if history gate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f12p-history-gate-report
          path: f12p_gate/
          if-no-files-found: warn
          retention-days: 45
  transfer:
    needs: history_gate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    timeout-minutes: 120
    env:
      PYTHONHASHSEED: '0'
      HF_HUB_DISABLE_TELEMETRY: '1'
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned frozen Qwen7B CPU runtime
        run: |
          python -m pip install --only-binary llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu llama-cpp-python==0.3.36 huggingface_hub==0.29.3
      - name: Execute 54 preregistered novel-family tool episodes only after HISTORY_PASS
        run: python -m observatory.f12p_cross_family_wording_transfer --shard ${{ matrix.shard }} --out f12p_transfer_shard
      - name: Preserve all public observations and raw model outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f12p-transfer-shard-${{ matrix.shard }}
          path: f12p_transfer_shard/
          if-no-files-found: warn
          retention-days: 45
  transfer_aggregate:
    needs: transfer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: f12p-transfer-shard-*
          merge-multiple: true
          path: f12p_transfer_shards
      - name: Audit all 216 episodes and frozen cross-family preregistration
        run: python -m observatory.f12p_cross_family_wording_transfer --aggregate-dir f12p_transfer_shards --out f12p_transfer_aggregate
      - name: Upload complete four-shard pilot results
        uses: actions/upload-artifact@v4
        with:
          name: f12p-two-family-wording-transfer-final
          path: f12p_transfer_aggregate/
          retention-days: 45
