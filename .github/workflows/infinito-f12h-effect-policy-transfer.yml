name: INFINITO F12-H frozen LLM effect-policy composition
on:
  push:
    branches: [experiment/f12h-effect-policy-transfer-20261108]
    paths:
      - observatory/f12h_effect_policy_transfer.py
      - tests/test_f12h_effect_policy_transfer.py
      - .github/workflows/infinito-f12h-effect-policy-transfer.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify prospective F12-H contracts (fake is never scientific evidence)
        run: python -m unittest tests.test_f12h_effect_policy_transfer -v
  frozen-llm-pilot:
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      PYTHONHASHSEED: '0'
      HF_HUB_DISABLE_TELEMETRY: '1'
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU backend
        run: |
          python -m pip install --only-binary llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu llama-cpp-python==0.3.36 huggingface_hub==0.29.3
      - name: Run frozen Qwen7B TRAIN and 60 paired TRAIN-heldout evaluations
        run: python -m observatory.f12h_effect_policy_transfer --out f12h_artifacts
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f12h-frozen7b-effect-policy-composition
          path: f12h_artifacts/
          if-no-files-found: warn
          retention-days: 30
