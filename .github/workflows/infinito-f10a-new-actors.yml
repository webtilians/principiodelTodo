name: INFINITO F10-A - Train actors on authentic misleading and blank F4

on:
  push:
    branches: [experiment/f10a-actor-evidence-robustness-training]
    paths:
      - docs/INFINITO_F10A_ACTOR_LAUNCH.md

permissions:
  contents: read
  actions: read

concurrency:
  group: f10a-new-actor-training-121-122m
  cancel-in-progress: false

jobs:
  train-and-development:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        seed: [0,1,2,3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install native MiniGrid recurrent actor dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r observatory/requirements_f9.txt gymnasium==1.4.0
      - name: Check preregistered task and original source invariants before worlds
        run: |
          python -m unittest discover -s tests -p 'test_f10a_actor_evidence_training.py' -v
          python -m unittest discover -s tests -p 'test_f9v_lexicographic_causal_f4.py' -v
          python -m py_compile observatory/f10a_actor_evidence_training.py observatory/f10a_actor_positivity_dev.py observatory/f10a_actor_dev_gate.py
          git diff --exit-code 898b6e43f6f1dd08b970fe4a0e4651d271944e80 -- observatory/f9v_lexicographic_causal_f4.py observatory/f9q_causal_fork.py observatory/f9i_selective_memory.py observatory/f9j_recurrent_memory_attribution.py observatory/f9t_learned_f4_read_gate.py observatory/f9o_long_blackout_training.py observatory/f9e_f4_autonomous.py src/
      - uses: actions/download-artifact@v4
        with:
          run-id: 40957255987
          repository: webtilians/principiodelTodo
          github-token: ${{ github.token }}
          name: f9o-new-models-seed-${{ matrix.seed }}
          path: f9o/seed-${{ matrix.seed }}
      - name: TRAIN only on brand-new 12100000+ paired teacher worlds
        run: |
          python -m observatory.f10a_actor_evidence_training --index ${{ matrix.seed }} --source f9o/seed-${{ matrix.seed }} --output f10a-new/seed-${{ matrix.seed }}
      - name: Verify same initialization, matched labels and frozen actor architecture
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from observatory.f9_external_minigrid import file_sha
          i=int("${{ matrix.seed }}")
          f=Path(f"f10a-new/seed-{i}")
          d=json.loads((f/"report.json").read_text())
          assert d["index"]==i and d["train_worlds"]==128
          assert d["phase"]=="TRAIN_ONLY" and d["train_examples_per_arm"]==1536
          assert d["corrupted_frames"]>0 and d["history_masked_frames"]>0
          assert set(d["arms"])=={"evidence_mixed","evidence_clean_control"}
          arm=list(d["arms"].values())
          assert arm[0]["initial_signature"]==arm[1]["initial_signature"]
          assert arm[0]["trained_signature"]!=arm[1]["trained_signature"]
          assert all(len(x["losses"])==10 and x["epochs"]==10 and x["examples"]==1536 for x in arm)
          assert all(file_sha(f/x["checkpoint"])==x["checkpoint_sha256"] for x in arm)
          assert not d["reader_head_trained"] and not d["old_confirm_reused"] and not d["future_confirm_opened"]
          print("F10A_NEW_ACTOR_TRAIN_VERIFIED",i,flush=True)
          PY
      - name: DEV only on untouched 12200000+ (no reader training)
        run: |
          python -m observatory.f10a_actor_positivity_dev --index ${{ matrix.seed }} --source f9o/seed-${{ matrix.seed }} --trained f10a-new/seed-${{ matrix.seed }} --output f10a-dev/seed-${{ matrix.seed }}
      - name: Audit 32 unique DEV worlds, both cues histories and 3 paired interventions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          i=int("${{ matrix.seed }}")
          d=json.loads(Path(f"f10a-dev/seed-{i}/report.json").read_text())
          assert d["index"]==i and d["phase"]=="DEV_ONLY"
          assert d["new_dev_seeds"]==[12200000+10000*i+j for j in range(32)]
          assert not d["reader_trained"] and not d["future_confirm_12300000_opened"]
          assert not d["previous_confirmations_reused"]
          for key,actor in d["actors"].items():
              assert len(actor["states"])==128
              assert len(actor["autonomous"])==128
              assert len(actor["by_cell"])==4
              assert all(len([x for x in actor["states"] if x["cue"]==cue and x["regime"]==regime])==32
                         for cue in ("key","ball")
                         for regime in ("history_f4_normal","history_f4_postcue_off"))
              assert all(x["fork_raw_equal_between_cues"] for x in actor["states"])
              assert all(x["outcomes"]["skip"]["read"]==0 and
                         x["outcomes"]["read_clean"]["read"]==1 and
                         x["outcomes"]["read_adversarial"]["read"]==1 for x in actor["states"])
          print("F10A_DEV_CAUSAL_MATCHED_AUDIT",i,flush=True)
          PY
      - name: Save original trained actor weights and independent DEV report
        if: always()
        run: |
          mkdir -p f10a-publish
          if test -f f10a-new/seed-${{ matrix.seed }}/report.json; then
            mkdir -p f10a-publish/train
            cp f10a-new/seed-${{ matrix.seed }}/* f10a-publish/train/
          fi
          if test -f f10a-dev/seed-${{ matrix.seed }}/report.json; then
            cp f10a-dev/seed-${{ matrix.seed }}/report.json f10a-publish/dev-report.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f10a-train-dev-seed-${{ matrix.seed }}
          path: f10a-publish/
          retention-days: 75
          if-no-files-found: warn

  scientific-gates:
    needs: train-and-development
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: f10a-train-dev-seed-*
          path: gathered
      - name: Apply PRECOMMITTED robustness and 16-cell causal positivity gates
        run: |
          python -m observatory.f10a_actor_dev_gate --gathered gathered --output f10a-dev-gates.json
          python - <<'PY'
          import os,json
          from pathlib import Path
          r=json.loads(Path("f10a-dev-gates.json").read_text())
          assert r["development_only"] and r["no_reader_training"]
          assert not r["future_confirm_12300000_opened"]
          lines=["# F10-A: New recurrent actors trained for reliable / misleading / missing F4",
                 "Same F9-O original BC starts each training arm; 128 new TRAIN worlds × 4 actors; 32 disjoint DEV worlds × 4 actors.",
                 "Both actor arms use same 1536 teacher sequences, same labels and budget; F4 evidence differs.",
                 "**No READ head trained. No F9-Y/F9-Z confirmation reopened.**",
                 "","## Preregistered DEV status: "+r["status"],
                 "Robust replicas (>=3 needed): "+str(r["robust_replicas"]),
                 "Replicas with ALL four supported D+ cells (4/4 needed): "+str(r["positivity_replicas_all_cells"]),
                 "",
                 "| Replica | Clean correct diff (mixed-control) /128 | Misleading correct diff /128 | 4/4 cells have 4+ D+ |",
                 "|---|---:|---:|---|"]
          for index,rep in r["per_replica"].items():
              g=rep["gate"]
              lines.append(f'| {index} | {g["clean_first_correct_delta"]} | {g["adversarial_first_correct_delta"]} | {g["actor_support_all_4_cells"]} |')
          lines+=["","## Breakdown of all original, control, experimental actors and four strata",
                  "~~~json",json.dumps(r["per_replica"],indent=2,ensure_ascii=False),"~~~",
                  "If DEV gates fail do not train any READ head, change thresholds or open 12300000+." ]
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(lines))
          print("F10A_PRECOMMITTED_ACTOR_AND_POSITIVITY_GATES",r["status"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: f10a-new-actors-scientific-dev-gates
          path: f10a-dev-gates.json
          retention-days: 75
          if-no-files-found: error
