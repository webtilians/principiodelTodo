name: INFINITO F10-E - Frozen Public Credential-Time Causal Factorial

on:
  push:
    branches: [experiment/f10e-credential-time-causal-factorial]
    paths:
      - docs/INFINITO_F10E_FROZEN_FACTORIAL_LAUNCH.md

permissions:
  contents: read
  actions: read

concurrency:
  group: f10e-frozen-16200000-2x2-causal-factorial
  cancel-in-progress: false

jobs:
  four-frozen-factorial-worlds:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        index: [0,1,2,3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU inference dependencies only
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy
      - name: Audit prospective factorial integrity BEFORE evaluating any worlds
        run: |
          python -m unittest discover -s tests -p 'test_f10e_public_credential_time_factorial.py' -v
          python -m py_compile observatory/f10e_public_factorial_worlds.py observatory/f10e_frozen_factorial_dev.py observatory/f10e_factorial_gate.py
          git diff --exit-code e3a4f30ddbbec7e0b7fbd9b61b2016ea4636c4f3 -- observatory/f10d_structural_transfer_worlds.py observatory/f10d_frozen_transfer_dev.py observatory/f10d_structural_transfer_gate.py
          git diff --exit-code 4a22f2e3904b7e3126ac1daeb5cf6d6d3bb6a82a -- observatory/f10c_multi_version_worlds.py observatory/f10c_relational_actor_training.py observatory/f10c_relational_actor_dev.py observatory/f10c_relational_dev_gate.py
          git diff --exit-code 9abeae79218f3623fd3aabd1e002c29df425fff1 -- observatory/f10b_temporal_evidence_task.py observatory/f10b_train_evidence_actors.py
      - name: Download verified ORIGINAL F10-C frozen model artifacts
        uses: actions/download-artifact@v4
        with:
          run-id: 41447171697
          repository: webtilians/principiodelTodo
          github-token: ${{ github.token }}
          name: f10c-actor-${{ matrix.index }}
          path: f10c-original/${{ matrix.index }}
      - name: Download verified ORIGINAL F10-B frozen model artifacts
        uses: actions/download-artifact@v4
        with:
          run-id: 41443064754
          repository: webtilians/principiodelTodo
          github-token: ${{ github.token }}
          name: f10b-actor-${{ matrix.index }}
          path: f10b-original/${{ matrix.index }}
      - name: Evaluate 108 brand-new paired factorial worlds on frozen actor models
        run: |
          python -m observatory.f10e_frozen_factorial_dev --index ${{ matrix.index }} --f10c-source f10c-original/${{ matrix.index }}/training --f10b-source f10b-original/${{ matrix.index }}/training --output f10e-report/${{ matrix.index }}
      - name: Audit no-training, all public-only factor combinations and provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          i=int("${{ matrix.index }}")
          path=Path(f"f10e-report/{i}/dev-report.json")
          r=json.loads(path.read_text())
          assert r["stage"]=="CAUSAL_FACTORIAL_DEV_ONLY" and r["index"]==i
          assert r["n_base_worlds"]==108 and r["n_cases"]==432
          assert r["seeds"]==[16200000+10000*i+j for j in range(108)]
          assert r["all_models_frozen"] and not r["train_performed"]
          assert not r["reader_head_trained"] and not r["old_worlds_revisited"]
          assert not r["confirmation_16300000_opened"]
          assert r["truth_from_public_signed_evidence_only"]
          assert r["paired_factorial_changes_public_history"]
          assert r["read_skip_same_recurrent_history_within_variant"]
          assert set(r["by_variant"])=={"U_before","U_after","S_before","S_after"}
          assert set(r["by_k"])=={"3","5","8"}
          assert set(r["by_timing"])=={"early","middle","late"}
          assert all(v["cases"]==108 for v in r["by_variant"].values())
          assert all(v["cases"]==144 for t in ("by_k","by_timing") for v in r[t].values())
          assert r["overall"]["correct"]["last_signed"]==432
          assert r["overall"]["correct"]["first_signed"]==324
          assert len(r["source_sha_provenance"]["frozen_checkpoint_sha256"])==5
          print("F10E_FROZEN_FACTORIAL_CONTRACT_OK",i,flush=True)
          PY
      - name: Preserve detailed counterfactual rows and SHA manifest
        if: always()
        run: |
          mkdir -p f10e-artifact
          if test -f f10e-report/${{ matrix.index }}/dev-report.json; then
            cp f10e-report/${{ matrix.index }}/dev-report.json f10e-artifact/
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f10e-actor-${{ matrix.index }}
          path: f10e-artifact/
          retention-days: 75
          if-no-files-found: warn

  independent-factorial-scientific-gates:
    needs: four-frozen-factorial-worlds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: f10e-actor-*
          path: gathered
      - name: Independently apply G1/G2/G3 to all original actors using Python stdlib
        run: |
          python -m observatory.f10e_factorial_gate --gathered gathered --output f10e-gates.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path("f10e-gates.json").read_text())
          assert r["phase"]=="DEV_DIAGNOSTIC_ONLY"
          assert r["no_training"] and not r["no_confirmation_opened"] is False
          assert r["all_original_checkpoints_frozen"]
          lines=["# INFINITO F10-E: credential vs chronology matched 2×2 factorial",
                 "Frozen F10-C/B actors. 4 replicas × 108 new base worlds × 4 variants each.",
                 "All labels from public last-signed evidence, not hidden evaluator tags.",
                 "**No training or previous holdouts reopened.**",
                 "","## Preregistered status: "+r["status"],
                 "Gates: "+str(r["gates"]),
                 "Passing replicas: "+str(r["replicas_passing"]),
                 "",
                 "| Index | Relational READ | Same actor SKIP | F10-C unary | F10-C GRU | Four-way correct worlds | Credential useful | Precedence useful |",
                 "|---|---:|---:|---:|---:|---:|---:|---:|"]
          for idx,x in r["per_replica"].items():
              n=x["correct"];c=x["contrasts"]
              lines.append(f'| {idx} | {n["rel_read"]}/432 | {n["rel_skip"]}/432 | {n["unary_read"]}/432 | {n["gru_only"]}/432 | {c["all_four_correct"]}/108 | {c["credential_useful"]}/108 | {c["precedence_useful"]}/108 |')
          lines+=["","## Full group and control breakdown",
                  "~~~json",json.dumps(r["per_replica"],indent=2,ensure_ascii=False),"~~~",
                  "**Development causal-diagnostic only: 16300000+ remains sealed.**"]
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(lines))
          print("F10E_FORMAL_PREREG_STATUS",r["status"],flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: f10e-independent-preregistered-factorial-gate
          path: f10e-gates.json
          retention-days: 75
          if-no-files-found: error
