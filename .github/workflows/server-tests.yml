name: Server tests

# The core job runs with pytest alone, so every test of the server (sign-in, portal, vault, photos, apps, tasks,
# guidelines, connecting) is skipped there. This job installs what the server needs and runs them all.

on:
  pull_request:
    branches: ["master"]
  push:
    branches: ["master"]

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the server's dependencies
        run: python -m pip install -q pytest "mcp>=2,<3" "cryptography>=42" "pykeepass>=4.1,<5"
      - name: Check they are all there
        run: python -c "import mcp.server.mcpserver, httpx2, starlette, uvicorn, cryptography, pykeepass"
      - name: Run every test
        run: python -m pytest -q tests/test_*v3.py
