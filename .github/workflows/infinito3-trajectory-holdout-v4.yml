name: INFINITO 3.0 Fourth Frozen Long-Horizon Held-out

on:
  push:
    branches: [eval/trajectory-heldout-v4-20260914]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heldout-v4:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install openai pytest
      - name: Deterministic tests before paid run
        run: python -m pytest tests/test_*v3.py -q
      - name: Frozen V4 with unchanged semantic event extractor
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: >-
          python scripts/run_infinito3_trajectory_holdout_v4.py
          --model gpt-5.6-luna
          --reasoning-effort none
          --embedding-provider openai
          --embedding-model text-embedding-3-small
          --semantic-reranker llm
          --reranker-model gpt-5.6-luna
          --event-model gpt-5.6-luna
          --output-dir trajectory-holdout-v4-results
      - name: Summary
        if: always()
        run: |
          if [ -d trajectory-holdout-v4-results ]; then
            find trajectory-holdout-v4-results -name '*.md' -exec cat {} \; >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infinito3-heldout-v4
          path: trajectory-holdout-v4-results/
          if-no-files-found: warn
          retention-days: 30
