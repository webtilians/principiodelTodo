name: INFINITO 3.0 Independent Trajectory Evaluation

on:
  push:
    branches: [eval/trajectory-harness-20260914]
    paths:
      - '.github/infinito3-trajectory-eval-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trajectory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install openai pytest
      - name: Deterministic tests
        run: python -m pytest tests/test_*v3.py -q
      - name: Independent long-horizon evaluation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: >-
          python scripts/run_infinito3_trajectory_eval.py
          --model gpt-5.6-luna
          --reasoning-effort none
          --embedding-provider openai
          --embedding-model text-embedding-3-small
          --output-dir trajectory-results
      - name: Summary
        if: always()
        run: |
          if [ -d trajectory-results ]; then
            find trajectory-results -name '*.md' -exec cat {} \; >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infinito3-independent-trajectories
          path: trajectory-results/
          if-no-files-found: warn
          retention-days: 30
