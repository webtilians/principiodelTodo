name: INFINITO F9-X - Frozen Head Information Attribution

on:
  push:
    branches: [experiment/f9x-frozen-head-information-attribution]
    paths: [docs/INFINITO_F9X_LAUNCH.md]

permissions:
  contents: read
  actions: read

concurrency:
  group: f9x-original-frozen-head-attribution
  cancel-in-progress: false

jobs:
  attribution:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        seed: [0,1,2,3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install frozen F9 actor CPU dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r observatory/requirements_f9.txt gymnasium==1.4.0
      - name: Validate split, patches, code and original actor invariants
        run: |
          python -m unittest discover -s tests -p 'test_f9x_frozen_head_attribution.py' -v
          python -m unittest discover -s tests -p 'test_f9v_lexicographic_causal_f4.py' -v
          python -m py_compile observatory/f9x_frozen_head_attribution.py
          git diff --exit-code 898b6e43f6f1dd08b970fe4a0e4651d271944e80 -- observatory/f9v_lexicographic_causal_f4.py observatory/f9q_causal_fork.py observatory/f9i_selective_memory.py observatory/f9j_recurrent_memory_attribution.py observatory/f9t_learned_f4_read_gate.py src/
      - uses: actions/download-artifact@v4
        with:
          run-id: 40957255987
          repository: webtilians/principiodelTodo
          github-token: ${{ github.token }}
          name: f9o-new-models-seed-${{ matrix.seed }}
          path: frozen-actor/bc-${{ matrix.seed }}
      - uses: actions/download-artifact@v4
        with:
          run-id: 40960267485
          repository: webtilians/principiodelTodo
          github-token: ${{ github.token }}
          name: f9p-ppo-models-seed-${{ matrix.seed }}
          path: frozen-actor/ppo-${{ matrix.seed }}
      - uses: actions/download-artifact@v4
        with:
          run-id: 41345497955
          repository: webtilians/principiodelTodo
          github-token: ${{ github.token }}
          name: f9v-frozen-actor-causal-dev-seed-${{ matrix.seed }}
          path: frozen-heads/${{ matrix.seed }}
      - name: Analyze frozen head on NEW 9500000 worlds only
        run: |
          python -m observatory.f9x_frozen_head_attribution --index ${{ matrix.seed }} --bc-source frozen-actor/bc-${{ matrix.seed }} --ppo-source frozen-actor/ppo-${{ matrix.seed }} --weights-source frozen-heads/${{ matrix.seed }} --output f9x-results/seed-${{ matrix.seed }}
      - name: Verify complete independent new split and no training
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          i=int("${{ matrix.seed }}")
          r=json.loads(Path(f"f9x-results/seed-{i}/report.json").read_text())
          assert r["index"]==i and r["states"]==128 and r["worlds"]==32
          assert len(r["cases"])==128 and len(r["predictions"])==128
          assert set(r["world_seeds"])=={9500000+10000*i+j for j in range(32)}
          assert all(c["public_fork_equal"] for c in r["cases"])
          assert not any(r[k] for k in ("original_f9v_8300000_reused","f9w_9300000_used","future_f9x_9600000_used","retrained_actor","retrained_head","retrained_F4"))
          print("F9X_NEW_WORLDS_FROZEN_ATTRIBUTION_VERIFIED",i)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f9x-frozen-head-new-worlds-seed-${{ matrix.seed }}
          path: f9x-results/seed-${{ matrix.seed }}/
          retention-days: 75
          if-no-files-found: warn

  aggregate:
    needs: attribution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: f9x-frozen-head-new-worlds-seed-*
          path: gathered
      - name: Report all four frozen heads, no selection
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          rs=[json.loads(Path(f"gathered/f9x-frozen-head-new-worlds-seed-{i}/report.json").read_text()) for i in range(4)]
          assert all(r["index"]==i and r["states"]==128 for i,r in enumerate(rs))
          names=("lex_hc","lex_public","key_normal","always","never")
          vals=("cases","reads","first_correct","useful_read","harmful_read","neutral_read","positive_available")
          methods={m:{v:sum(r["summary"]["strategies"][m][v] for r in rs) for v in vals} for m in names}
          patches={}
          for name in ("cue_H","cue_C","cue_HC","history_HC"):
            d=[r["summary"]["patches"].get(name) for r in rs]
            patches[name]={v:sum(x[v] for x in d if x) for v in ("eligible_states","flipped_decisions","useful_read","harmful_read","neutral_read")}
            patches[name]["replica_flips"]=[x["flipped_decisions"] if x else 0 for x in d]
          pairs={"total":sum(r["summary"]["matched_cue_pairs"]["n"] for r in rs),
                 "different_READ":sum(r["summary"]["matched_cue_pairs"]["different_READ"] for r in rs),
                 "by_replica":[r["summary"]["matched_cue_pairs"]["different_READ"] for r in rs]}
          result={"experiment":"F9-X","stage":"EXPLORATORY","worlds":128,"states":512,
                  "methods":methods,"patches":patches,"matched_cue_pairs":pairs,
                  "replicas":[{"index":r["index"],"summary":r["summary"]} for r in rs],
                  "reused_8300000":False,"opened_9600000":False}
          Path("f9x-summary.json").write_text(json.dumps(result,indent=2,ensure_ascii=False))
          lines=["# F9-X: frozen-head information attribution, new 9500000+ worlds",
                 "Observer-only cue shortcut has privileged cue and history labels and is not deployable.",
                 "Causal D is evaluation-only. Teacher prefix, one fork READ/SKIP, no new training.",
                 "","| Method | Correct /512 | READ | Beneficial READ | Harmful READ | Neutral READ |",
                 "|---|---:|---:|---:|---:|---:|"]
          for name,v in methods.items():
            lines.append(f'| {name} | {v["first_correct"]} | {v["reads"]} | {v["useful_read"]} | {v["harmful_read"]} | {v["neutral_read"]} |')
          lines+=["","| Input patch | Eligible states | READ flips | Beneficial READ | Harmful READ |",
                  "|---|---:|---:|---:|---:|"]
          for name,v in patches.items():
            lines.append(f'| {name} | {v["eligible_states"]} | {v["flipped_decisions"]} | {v["useful_read"]} | {v["harmful_read"]} |')
          lines+=["","Matched inverted-cue evidence: "+str(pairs),
                  "","Individual replicas incl. strata and group sensitivities:",
                  "~~~json",json.dumps(result["replicas"],indent=2,ensure_ascii=False),"~~~",
                  "The 9600000+ holdout remains sealed. 8300000+ was never reused."]
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(lines))
          print("F9X_FOUR_REPLICA_ATTRIBUTION",json.dumps(result,ensure_ascii=False),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: f9x-frozen-head-aggregate
          path: f9x-summary.json
          retention-days: 75
          if-no-files-found: error
