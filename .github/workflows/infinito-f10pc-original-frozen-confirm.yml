name: INFINITO F10-P-C - Original Frozen Public-Output Confirmation 28300000

on:
  push:
    branches: [experiment/f10pc-independent-public-effects-confirm-28300000]
    paths: [docs/INFINITO_F10PC_LAUNCH.md]

permissions:
  contents: read
  actions: read

concurrency:
  group: f10pc-28300000-original-single-confirm
  cancel-in-progress: false

jobs:
  confirm_original_frozen:
    name: F10-P-C original frozen public event memories replica #${{ matrix.replica }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        replica: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: CPU dependencies solely for loading ORIGINAL F10-L skills
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy
      - name: Verify preregistration, immutable original F10-P code, and no product modifications
        run: |
          python -m py_compile observatory/f10pc_confirm_eval.py observatory/f10pc_confirm_audit.py
          git diff --exit-code 9de6adb6ff0299b361d72258b9d988f832256201 -- \
            observatory/f10p_worlds.py \
            observatory/f10p_events.py \
            observatory/f10p_experiment.py \
            observatory/f10n_memory.py \
            observatory/f10n_worlds.py \
            observatory/f10m_experiment.py \
            observatory/f10l_train.py \
            src/infinito3
          test -f docs/INFINITO_F10PC_PREREG_2026-11-04.md
      - name: Fetch ORIGINAL F10-P trial, frozen memory and original DEV/OOD outputs
        uses: actions/download-artifact@v4
        with:
          repository: webtilians/principiodelTodo
          run-id: 41888234405
          github-token: ${{ github.token }}
          name: f10p-original-public-events-${{ matrix.replica }}
          path: original-snapshots/${{ matrix.replica }}
      - name: Fetch ORIGINAL F10-P independent audit science, no recomputation
        uses: actions/download-artifact@v4
        with:
          repository: webtilians/principiodelTodo
          run-id: 41888234405
          github-token: ${{ github.token }}
          name: f10p-independent-public-event-science
          path: original-science
      - name: Fetch ORIGINAL F10-L skills from run 41685499939
        uses: actions/download-artifact@v4
        with:
          repository: webtilians/principiodelTodo
          run-id: 41685499939
          github-token: ${{ github.token }}
          name: f10l-stage1-${{ matrix.replica }}
          path: original-skills/${{ matrix.replica }}
      - name: Fetch ORIGINAL F10-L G0 model manifest
        uses: actions/download-artifact@v4
        with:
          repository: webtilians/principiodelTodo
          run-id: 41685499939
          github-token: ${{ github.token }}
          name: f10l-independent-g0-original
          path: original-g0
      - name: FIRST replay original 8960 rows x4 interventions; ONLY THEN generate reserved 28300000+ cases
        run: |
          mkdir -p f10pc-outputs
          set -o pipefail
          python -m observatory.f10pc_confirm_eval \
            --replica ${{ matrix.replica }} \
            --original original-snapshots/${{ matrix.replica }} \
            --skills original-skills/${{ matrix.replica }} \
            --g0 original-g0/f10l-g0.json \
            --science original-science/f10p-original-science.json \
            --out f10pc-outputs/${{ matrix.replica }} \
            | tee f10pc-outputs/f10pc-${{ matrix.replica }}.log
          test -f f10pc-outputs/${{ matrix.replica }}/original_replay_preconfirm.json
          test -f f10pc-outputs/${{ matrix.replica }}/confirm_rows.json
          test -f f10pc-outputs/${{ matrix.replica }}/confirm_complete.json
      - name: Verify snapshot SHA unmodified after confirm and preserve metadata
        if: always()
        run: |
          if test -d f10pc-outputs/${{ matrix.replica }}; then
            cp f10pc-outputs/f10pc-${{ matrix.replica }}.log \
               f10pc-outputs/${{ matrix.replica }}/f10pc.log || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f10pc-original-frozen-confirm-${{ matrix.replica }}
          path: f10pc-outputs/${{ matrix.replica }}/
          if-no-files-found: warn
          retention-days: 90

  independent_confirm_audit:
    name: F10-P-C independent data-only world-grouped 2000x audit
    needs: confirm_original_frozen
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install auditor NumPy only; NO original models, simulator or Torch
        run: python -m pip install numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: f10pc-original-frozen-confirm-*
          path: outputs
      - uses: actions/download-artifact@v4
        with:
          repository: webtilians/principiodelTodo
          run-id: 41888234405
          github-token: ${{ github.token }}
          name: f10p-independent-public-event-science
          path: original-science
      - name: Independently verify original replay SHA, all 7 new arms, causal contrasts and gates
        run: |
          mkdir -p complete
          for r in 0 1 2 3; do
            mkdir -p complete/$r
            cp outputs/f10pc-original-frozen-confirm-$r/* complete/$r/
          done
          python -m observatory.f10pc_confirm_audit \
            --root complete \
            --original-science original-science/f10p-original-science.json \
            --out f10pc-independent-confirm-science.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          a=json.loads(Path('f10pc-independent-confirm-science.json').read_text())
          assert a['technical']=='F10PC_TECHNICAL_COMPLETE'
          assert a['unique_confirm_cases']==2048
          assert all(r['original']['original_dev_ood_rows_replayed']==8960
                     for r in a['replicas'].values())
          lines=[
            '# F10-P-C ORIGINAL independent confirmation on frozen F10-P memories',
            '**'+a['status']+'** — SCIENTIFIC status, not confused with technical success',
            'All 4 original replicas: 8960 old original DEV/OOD rows replayed identically BEFORE 28300000+ seeds generated; 20 F10-L checkpoint SHA and all 28 original memory SHA unchanged.',
            '128 NEW world blocks/replica x 4 linked variants; 2000 prereg bootstrap; 7 original unmodified arms and same four causal interventions. **No retraining, no model selection, no product edits.**',
            '',
            '| Replica | E100 full | E50 half | E0 terminal | E_noX | E_shuffleX | B reward | I privileged | E100 program |',
            '|---|---:|---:|---:|---:|---:|---:|---:|---|']
          for i,r in a['replicas'].items():
              m=r['confirm_metrics']
              vals=[m[x]['accuracy'] for x in
                    ('E100','E50','E0','E_noX','E_shuffleX','B_reward','I_privileged')]
              lines.append('| '+i+' | '+' | '.join(f'{x*100:.2f}%' for x in vals)
                           +' | '+str(m['E100']['programs'])+' |')
          lines.extend(['','Gates: '+str(a['gate_counts']),
                        'Raw paired-world CI and all metrics in f10pc-independent-confirm-science.json.',
                        'This reuses the SAME synthetic world physics and a researcher-supplied event contract: NOT general autonomous invention of tools.'])
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('\n'.join(lines))
          print('F10PC_CONFIRM_FINAL',a['status'],a['gate_counts'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: f10pc-original-independent-confirm-audit
          path: f10pc-independent-confirm-science.json
          retention-days: 90
          if-no-files-found: error
