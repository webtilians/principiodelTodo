name: INFINITO F12-C - Genuine Qwen2.5 3B GGUF competence preflight

on:
  push:
    branches:
      - experiment/f12c-3b-gguf-competence-20261106
    paths:
      - 'observatory/f12c_gguf_competence.py'
      - 'tests/test_f12c_gguf_competence.py'
      - '.github/workflows/infinito-f12c-gguf-competence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify fake-only tests, private-state isolation and preregistered thresholds
        run: python -m unittest tests.test_f12c_gguf_competence -v

  genuine-frozen-3b:
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      PYTHONHASHSEED: "0"
      HF_HUB_DISABLE_TELEMETRY: "1"
      OMP_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned prebuilt CPU llama.cpp bindings; never build or substitute
        run: |
          python -m pip install --disable-pip-version-check --only-binary llama-cpp-python \
            --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu \
            llama-cpp-python==0.3.36 huggingface_hub==0.29.3
      - name: Run six NEW incidents with frozen Qwen 3B Q5_K_M and no memory
        run: |
          python -m observatory.f12c_gguf_competence --out f12c_competence_artifacts
      - name: Preserve all raw model decisions and sealed evaluator outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f12c-qwen-3b-q5-frozen-competence
          path: f12c_competence_artifacts/
          if-no-files-found: warn
          retention-days: 30
