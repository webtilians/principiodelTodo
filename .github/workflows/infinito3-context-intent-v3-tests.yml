name: INFINITO 3.0 ContextIntent v3 Deterministic
on:
  push:
    branches: [fix/context-intent-v3-mixed-state-20260915]
permissions:
  contents: read
jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen direct dependencies
        run: python -m pip install openai==3.14.0 pytest==9.1.1
      - name: Run INFINITO 3 deterministic suite
        # The frozen-V7 acceptance test must fail once development code changes.
        # A v3 regression test explicitly asserts that the V7 preflight rejects
        # this modified candidate, preserving the holdout boundary.
        run: >-
          python -m pytest -q tests/*_v3.py --disable-warnings
          -k "not test_v7_preflight_accepts_frozen_manifest"
