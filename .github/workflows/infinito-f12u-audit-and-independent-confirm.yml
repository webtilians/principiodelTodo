name: INFINITO F12-U restore F12-T audit then confirm prefix path
on:
  push:
    branches: [experiment/f12u-independent-prefix-path-confirm-20261109]
    paths:
      - observatory/f12t_recover_original_artifacts.py
      - observatory/f12u_prefix_path_independent.py
      - tests/test_f12u_prefix_path_independent.py
      - .github/workflows/infinito-f12u-audit-and-independent-confirm.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify frozen SHA, token-sentinel intervention and fake-only contracts
        env:
          PYTHONHASHSEED: '0'
          OMP_NUM_THREADS: '4'
        run: python -m unittest tests.test_f12u_prefix_path_independent -v
  recover-f12t-original:
    needs: contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download F12-T original worker 0, never re-run inference
        uses: actions/download-artifact@v4
        with:
          name: f12t-worker-0
          run-id: 42675902103
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: original_workers
      - name: Download F12-T original worker 1
        uses: actions/download-artifact@v4
        with:
          name: f12t-worker-1
          run-id: 42675902103
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: original_workers
      - name: Download F12-T original worker 2
        uses: actions/download-artifact@v4
        with:
          name: f12t-worker-2
          run-id: 42675902103
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: original_workers
      - name: Download F12-T original scientific summary
        uses: actions/download-artifact@v4
        with:
          name: f12t-llamacpp-prefix-final
          run-id: 42675902103
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: original_summary
      - name: Recover complete JSON audit and compare frozen T0-T5 without model
        run: |
          python -m observatory.f12t_recover_original_artifacts \
            --workers original_workers \
            --summary original_summary \
            --out recovered_audit
      - name: Preserve full old trace and cryptographic manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f12u-original-f12t-full-audit-recovered
          path: recovered_audit/
          if-no-files-found: warn
          retention-days: 45
  confirm-real-qwen:
    needs: recover-f12t-original
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        worker: [0, 1, 2]
    env:
      PYTHONHASHSEED: '0'
      HF_HUB_DISABLE_TELEMETRY: '1'
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen Qwen2.5-7B GGUF CPU runtime
        run: |
          python -m pip install --only-binary llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu llama-cpp-python==0.3.36 huggingface_hub==0.29.3
      - name: Run independent prefix-invalidation and token-level sample traces
        run: python -m observatory.f12u_prefix_path_independent --worker ${{ matrix.worker }} --out f12u_cells
      - name: Preserve every frozen prompt and model-state trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f12u-worker-${{ matrix.worker }}
          path: f12u_cells/
          if-no-files-found: warn
          retention-days: 45
  aggregate:
    needs: [recover-f12t-original, confirm-real-qwen]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: f12u-original-f12t-full-audit-recovered
          path: recovered_audit
      - uses: actions/download-artifact@v4
        with:
          pattern: f12u-worker-*
          merge-multiple: true
          path: f12u_workers
      - name: Audit all 336 frozen Qwen calls and preregistered gates U0-U5
        run: |
          python -m observatory.f12u_prefix_path_independent \
            --aggregate-dir f12u_workers \
            --recovery-manifest recovered_audit/f12t_recovery_manifest.json \
            --out f12u_final
      - name: Preserve complete new scientific audit, even for negative result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f12u-independent-prefix-path-confirm-final
          path: f12u_final/
          if-no-files-found: warn
          retention-days: 45
