name: INFINITO 3.0 Semantic Interpreter Diagnostic

on:
  push:
    branches: [feat/semantic-events-structured-state-20260914]
    paths:
      - '.github/infinito3-semantic-diagnostic-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install openai pytest
      - name: Deterministic tests before paid diagnostic
        run: python -m pytest tests/test_*v3.py -q
      - name: Semantic parser diagnostic
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
        run: python scripts/diagnose_infinito3_semantic_interpreters.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infinito3-semantic-interpreter-diagnostic
          path: semantic-diagnostic-results/
          if-no-files-found: warn
          retention-days: 30
