name: INFINITO Security S0 isolated lab
on:
  pull_request:
    branches: [master]
    paths:
      - "security_lab/**"
      - "tests/test_security_lab_s0.py"
      - "docs/INFINITO_SECURITY_S0_PROTOCOL_2026-11-09.md"
      - ".github/workflows/infinito-security-s0.yml"
      - "src/infinito3/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  s0:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install only lab dependencies
        run: python -m pip install pytest "cryptography>=42"
      - name: Run S0 contracts
        run: python -m pytest tests/test_security_lab_s0.py -q
      - name: Build disposable clone image
        run: docker build -f security_lab/Dockerfile -t infinito-security-s0 .
      - name: Enforce OS-level isolation and run S0
        run: |
          docker run --rm \
            --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 64 --memory 512m --cpus 1 \
            --tmpfs /tmp:rw,noexec,nosuid,size=32m,mode=1777 \
            infinito-security-s0
