name: INFINITO 3.0 Trajectory Regression Tests

on:
  push:
    branches: [eval/trajectory-harness-20260914]
    paths:
      - '.github/workflows/infinito3-trajectory-tests.yml'
      - 'src/infinito3/**'
      - 'tests/test_*v3.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Deterministic INFINITO 3.0 tests
        run: python -m pytest tests/test_*v3.py -q
