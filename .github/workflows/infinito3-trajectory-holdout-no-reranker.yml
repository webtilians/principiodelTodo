name: INFINITO 3.0 Held-out Ablation — Reranker OFF

on:
  push:
    branches: [eval/trajectory-harness-20260914]
    paths:
      - '.github/infinito3-trajectory-holdout-no-reranker-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  holdout-no-reranker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install openai pytest
      - name: Deterministic tests
        run: python -m pytest tests/test_*v3.py -q
      - name: Frozen held-out trajectories — reranker OFF
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: >-
          python scripts/run_infinito3_trajectory_holdout.py
          --model gpt-5.6-luna
          --reasoning-effort none
          --embedding-provider openai
          --embedding-model text-embedding-3-small
          --semantic-reranker none
          --baseline-mode stub
          --output-dir trajectory-holdout-no-reranker-results
      - name: Summary
        if: always()
        run: |
          if [ -d trajectory-holdout-no-reranker-results ]; then
            find trajectory-holdout-no-reranker-results -name '*.md' -exec cat {} \; >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infinito3-heldout-no-reranker
          path: trajectory-holdout-no-reranker-results/
          if-no-files-found: warn
          retention-days: 30
