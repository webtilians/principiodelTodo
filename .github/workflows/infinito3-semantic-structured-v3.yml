name: INFINITO 3.0 Frozen V3 Semantic Structured Evaluation

on:
  push:
    branches: [feat/semantic-events-structured-state-20260914]
    paths:
      - '.github/infinito3-semantic-structured-v3-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install openai pytest
      - name: Deterministic tests before paid run
        run: python -m pytest tests/test_*v3.py -q
      - name: Frozen V3 semantic events and structured state
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: >-
          python scripts/run_infinito3_semantic_structured_v3.py
          --model gpt-5.6-luna
          --reasoning-effort none
          --embedding-provider openai
          --embedding-model text-embedding-3-small
          --semantic-reranker llm
          --reranker-model gpt-5.6-luna
          --interpreter-model gpt-5.6-luna
          --output-dir semantic-structured-v3-results
      - name: Summary
        if: always()
        run: |
          if [ -d semantic-structured-v3-results ]; then
            find semantic-structured-v3-results -name '*.md' -exec cat {} \; >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infinito3-semantic-structured-v3
          path: semantic-structured-v3-results/
          if-no-files-found: warn
          retention-days: 30
