name: INFINITO F12-G verified strategy utility
on:
  push:
    branches: [experiment/f12g-validated-strategy-utility-20261106]
    paths:
      - observatory/f12g_verified_strategy_utility.py
      - tests/test_f12g_verified_strategy_utility.py
      - .github/workflows/infinito-f12g-verified-utility.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest tests.test_f12f_evidence_validator tests.test_f12g_verified_strategy_utility -v
  frozen-llm-pilot:
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PYTHONHASHSEED: '0'
      HF_HUB_DISABLE_TELEMETRY: '1'
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --only-binary llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu llama-cpp-python==0.3.36 huggingface_hub==0.29.3
      - run: python -m observatory.f12g_verified_strategy_utility --out f12g_experiment_artifacts
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f12g-frozen7b-verified-strategy-utility
          path: f12g_experiment_artifacts/
          if-no-files-found: warn
          retention-days: 30
