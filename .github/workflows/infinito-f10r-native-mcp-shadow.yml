name: INFINITO F10-R - Native MCP Effect Utility vs Documented Policy

on:
  push:
    branches: [experiment/f10r-native-memory-mcp-shadow-20261104]
    paths: [docs/INFINITO_F10R_LAUNCH.md]

permissions:
  contents: read

concurrency:
  group: f10r-original-native-mcp-strong-docs-baseline
  cancel-in-progress: false

jobs:
  original_native_mcp:
    name: F10-R native product MCP replica ${{ matrix.replica }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        replica: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: webtilians/principiodelTodo
          ref: f6bd6239bfc1734c04c233a5cf8cef050c6d54c2
          path: actual-product
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned ACTUAL product MCP package (no lab imitation)
        run: |
          test -f actual-product/pyproject.toml
          python -m pip install -e './actual-product[mcp]' 'numpy>=1.26,<3'
          python -c 'from infinito3.mcp_server import AgentMemory; from mcp import Client, StdioServerParameters; print("NATIVE_PRODUCT_MCP_SDK_AVAILABLE")'
          test "$(git -C actual-product rev-parse HEAD)" = f6bd6239bfc1734c04c233a5cf8cef050c6d54c2
      - name: Verify source and preregistration before all data generation
        run: |
          python -m py_compile observatory/f10r_native_mcp.py observatory/f10r_native_audit.py
          git diff --exit-code 977743b6dfb3863d0b0954238ecc8c64fb0f1bc3 -- \
            observatory/f10p_events.py observatory/f10q_shadow_run.py \
            observatory/f10p_worlds.py src/infinito3
          test -f docs/INFINITO_F10R_PREREG_2026-11-04.md
      - name: Run real MCP trained effect utility then frozen OOD vs documented baseline
        run: |
          mkdir -p outputs
          set -o pipefail
          python -m observatory.f10r_native_mcp \
            --replica ${{ matrix.replica }} --product actual-product \
            --out outputs/${{ matrix.replica }} | tee outputs/f10r-${{ matrix.replica }}.log
      - name: Verify exact memory snapshots, no product changes, full 3-arm OOD
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          r=${{ matrix.replica }}
          p=Path(f'outputs/{r}')
          h=lambda n:hashlib.sha256((p/n).read_bytes()).hexdigest()
          frozen=json.loads((p/'frozen.json').read_text())
          result=json.loads((p/'complete.json').read_text())
          assert frozen['product_commit']=='f6bd6239bfc1734c04c233a5cf8cef050c6d54c2'
          assert frozen['train_cases']==100 and frozen['model_locked_pre_ood']
          assert frozen['temp_db_only']
          assert result['no_production_mcp_used']
          assert h('frozen.json')==result['frozen_sha']
          assert h('train_calls.json')==frozen['train_sha']
          assert h('LEARNED.json')==frozen['learned_sha']
          assert h('SHUFFLED.json')==frozen['shuffled_sha']
          for arm in ('DOCS','LEARNED','SHUFFLED'):
              assert len(json.loads((p/('eval_'+arm+'.json')).read_text())['rows'])==48
          print('F10R_NATIVE_MCP_FROZEN_INPUTS_VERIFIED',r,flush=True)
          PY
          test "$(git -C actual-product rev-parse HEAD)" = f6bd6239bfc1734c04c233a5cf8cef050c6d54c2
      - name: Preserve logs and statuses
        if: always()
        run: |
          if test -d outputs/${{ matrix.replica }}; then
            cp outputs/f10r-${{ matrix.replica }}.log outputs/${{ matrix.replica }}/run.log || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f10r-original-native-mcp-${{ matrix.replica }}
          path: outputs/${{ matrix.replica }}/
          if-no-files-found: warn
          retention-days: 90

  independent_data_audit:
    name: F10-R independent paired workflow bootstrap and deletion audit
    needs: original_native_mcp
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Only NumPy for independent auditor (NO MCP, product or learner)
        run: python -m pip install 'numpy>=1.26,<3'
      - uses: actions/download-artifact@v4
        with:
          pattern: f10r-original-native-mcp-*
          path: originals
      - name: Verify native MCP outputs, strong baseline, frozen stats, 2000 paired resamples
        run: |
          mkdir -p audited
          for r in 0 1 2 3; do
            mkdir -p audited/$r
            cp originals/f10r-original-native-mcp-$r/* audited/$r/
          done
          python -m observatory.f10r_native_audit \
            --root audited --out f10r-independent-science.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          a=json.loads(Path('f10r-independent-science.json').read_text())
          assert a['technical']=='F10R_INDEPENDENT_AUDIT_COMPLETE'
          lines=[
            '# INFINITO F10-R: REAL INFINITO MCP with 3 isolated synthetic policies',
            '**Scientific status: '+a['status']+'**',
            '**Gate counts: '+str(a['gate_counts'])+'**',
            'Only ephemeral synthetic memories; actual pinned product MCP 4 tools. Never used personal memory.',
            '| Replica | Docs baseline | Learned effects | Shuffled labels | Docs calls | Learned calls |',
            '|---|---:|---:|---:|---:|---:|',
          ]
          for rep,result in a['replicas'].items():
              x=result['scores']
              lines.append(
                  '| '+rep+' | '+' | '.join([
                   '%.1f%%'%(100*x[arm]['accuracy']) for arm in
                   ('DOCS','LEARNED','SHUFFLED')])+
                  ' | '+str(x['DOCS']['agent_calls'])+
                  ' | '+str(x['LEARNED']['agent_calls'])+' |')
          lines.append('Incremental advantage vs competent docs, not absolute score, is the required PASS. A tie or loss means NO-GO.')
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('\n'.join(lines))
          print('F10R_ORIGINAL_SCIENTIFIC_STATUS',a['status'],a['gate_counts'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: f10r-independent-native-mcp-science
          path: f10r-independent-science.json
          if-no-files-found: error
          retention-days: 90
