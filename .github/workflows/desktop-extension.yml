name: Claude Desktop extension

# Builds dist/infinito-memory.mcpb, checks it with the official mcpb CLI and attaches it to every
# published release, so the README's download link always points at the latest one.
on:
  pull_request:
    paths: ["mcpb/**", "src/infinito3/**", "pyproject.toml", ".github/workflows/desktop-extension.yml"]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Vault and MCP server tests (the core CI has no optional dependencies)
        run: |
          python -m pip install -q pytest anyio "mcp>=2,<3" "pykeepass>=4.1,<5"
          python -m pytest -q tests/test_vault_v3.py tests/test_mcp_server_v3.py tests/test_remote_v3.py
      - name: Build the bundle
        run: python mcpb/build.py
      - name: Validate it with the official CLI
        run: |
          npx -y @anthropic-ai/mcpb@2 validate dist/mcpb-build/manifest.json
          npx -y @anthropic-ai/mcpb@2 info dist/infinito-memory.mcpb
      - name: Start it as Claude Desktop does, with uv, and call its tools
        run: |
          python -m pip install -q uv "mcp>=2,<3" anyio
          mkdir -p /tmp/bundle && python -m zipfile -e dist/infinito-memory.mcpb /tmp/bundle
          python mcpb/check_bundle.py "$(which uv)" /tmp/bundle /tmp/memory
      - uses: actions/upload-artifact@v4
        with:
          name: infinito-memory-mcpb
          path: dist/infinito-memory.mcpb
      - name: Attach it to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/infinito-memory.mcpb --clobber
