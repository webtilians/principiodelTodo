name: INFINITO S0-J2 sealed GPT memory reading comparison (NO DEPLOY)

on:
  push:
    branches: ["experiment/s0j2-gpt-sealed-bank-20261110"]
    paths:
      - "security_lab/s0j2.py"
      - "security_lab/fixtures/s0j2_*.json"
      - "tests/test_security_lab_s0j2.py"
      - "docs/INFINITO_S0J2_*"
      - ".github/workflows/infinito-s0j2-gpt.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s0j2-sealed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install strict scoring and SQLite memory dependencies
        run: python -m pip install -q pytest "mcp>=2,<3" "cryptography>=42" "pykeepass>=4.1,<5"
      - name: Validate sealed worlds, remembered source and non-leaking prompts
        run: |
          python -m compileall -q security_lab/s0j2.py
          python -m pytest -q -rx tests/test_security_lab_s0j2.py tests/test_security_lab_s0j0.py
      - name: Verify published preregistration and immutable fixture hashes
        run: |
          python - <<'PY'
          from security_lab import s0j2
          public, labels = s0j2.load_bank()
          print("S0J2_BANK_SEAL_SHA256=" + s0j2.sha({"public": public, "labels": labels}))
          print("S0J2_WORLDS_SHA256=" + s0j2.sha(public))
          PY

  prepare_offline:
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated local OAuth/MCP fixture runner
        run: docker build -f security_lab/Dockerfile.s0c -t infinito-s0j2-fixture .
      - name: Collect 72 authentic local MCP observations, seal 24 prompts
        run: |
          set -euo pipefail
          mkdir -p prepared
          chmod 0777 prepared
          docker run --rm \
            --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 128 --memory 2500m --cpus 4 \
            --tmpfs /tmp:rw,nosuid,size=256m,mode=1777 \
            --mount "type=bind,src=$PWD/prepared,dst=/out" \
            --entrypoint python infinito-s0j2-fixture \
            -m security_lab.s0j2 prepare \
              --prompts /out/prompts.json --observations /out/observations.json
          test -s prepared/prompts.json
          test -s prepared/observations.json
      - name: Preserve ONLY synthetic API prompts (no oracle labels)
        uses: actions/upload-artifact@v4
        with:
          name: s0j2-api-prompts-synthetic
          path: prepared/prompts.json
          retention-days: 30
      - name: Preserve independent observed evaluator evidence
        uses: actions/upload-artifact@v4
        with:
          name: s0j2-evaluator-only-observations
          path: prepared/observations.json
          retention-days: 30

  gpt_api:
    if: github.event_name == 'workflow_dispatch'
    needs: prepare_offline
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned-major OpenAI Responses client
        run: python -m pip install -q "openai>=2,<3" "mcp>=2,<3" "cryptography>=42" "pykeepass>=4.1,<5"
      - uses: actions/download-artifact@v4
        with:
          name: s0j2-api-prompts-synthetic
          path: prompt_only
      - name: Run GPT isolated requests on sealed synthetic bank
        run: |
          mkdir -p result
          python -m security_lab.s0j2 gpt \
            --prompts prompt_only/prompts.json --out result/gpt_raw.json
      - name: Archive raw outputs even if API/model is blocked
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s0j2-gpt-independent-raw
          path: result/
          retention-days: 30

  grade:
    if: github.event_name == 'workflow_dispatch'
    needs: [prepare_offline, gpt_api]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install source-only grader dependencies
        run: python -m pip install -q "mcp>=2,<3" "cryptography>=42" "pykeepass>=4.1,<5"
      - uses: actions/download-artifact@v4
        with:
          name: s0j2-api-prompts-synthetic
          path: prompt_only
      - uses: actions/download-artifact@v4
        with:
          name: s0j2-evaluator-only-observations
          path: evaluator_only
      - uses: actions/download-artifact@v4
        with:
          name: s0j2-gpt-independent-raw
          path: raw_gpt
      - name: Strict preregistered evaluation from real observed source
        run: |
          mkdir -p report
          python -m security_lab.s0j2 grade \
            --prompts prompt_only/prompts.json \
            --observations evaluator_only/observations.json \
            --results raw_gpt/gpt_raw.json \
            --out report/gpt_competence.json
      - name: Preserve all scientific details without post-hoc repair
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s0j2-gpt-scientific-report
          path: report/
          retention-days: 30
