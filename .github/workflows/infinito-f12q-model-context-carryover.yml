name: INFINITO F12-Q order position and model-instance carryover
on:
  push:
    branches: [experiment/f12q-model-context-carryover-20261109]
    paths:
      - observatory/f12q_model_context_carryover.py
      - tests/test_f12q_model_context_carryover.py
      - .github/workflows/infinito-f12q-model-context-carryover.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify frozen SHA, isolated cells, fresh-vs-reused state and fake-only guard
        env:
          PYTHONHASHSEED: '0'
          OMP_NUM_THREADS: '4'
        run: python -m unittest tests.test_f12q_model_context_carryover -v
  qwen7b-factor-workers:
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        worker: [0, 1]
    env:
      PYTHONHASHSEED: '0'
      HF_HUB_DISABLE_TELEMETRY: '1'
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen Qwen2.5-7B CPU GGUF inference
        run: |
          python -m pip install --only-binary llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu llama-cpp-python==0.3.36 huggingface_hub==0.29.3
      - name: Execute 8 separate OS child processes with fresh/reused instances
        run: python -m observatory.f12q_model_context_carryover --worker ${{ matrix.worker }} --out f12q_trials
      - name: Archive 8 child audits and full worker output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f12q-worker-${{ matrix.worker }}
          path: f12q_trials/
          if-no-files-found: warn
          retention-days: 45
  aggregate:
    needs: qwen7b-factor-workers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: f12q-worker-*
          merge-multiple: true
          path: f12q_workers
      - name: Audit all 80 inference calls and frozen Q0-Q5 diagnostic gates
        run: python -m observatory.f12q_model_context_carryover --aggregate-dir f12q_workers --out f12q_aggregate
      - name: Publish full diagnostic with cache proxies, raw outputs and cell effects
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f12q-order-position-instance-final
          path: f12q_aggregate/
          if-no-files-found: warn
          retention-days: 45
