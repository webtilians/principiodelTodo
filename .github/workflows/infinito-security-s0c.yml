name: INFINITO Security S0-C frozen 7B real MCP memory ablation

on:
  push:
    branches: ["experiment/security-s0c-real-llm-memory-20261109"]
    paths:
      - "security_lab/**"
      - "tests/test_security_lab_s0c.py"
      - "docs/INFINITO_SECURITY_S0C_PROTOCOL_2026-11-09.md"
      - ".github/workflows/infinito-security-s0c.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s0c-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Technical contracts and fixed split
        run: |
          python -m pip install -q pytest cryptography
          python -m pytest tests/test_security_lab_s0c.py -q

  inference:
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download ONLY frozen public GGUF to ephemeral GitHub runner
        id: gguf
        run: |
          python -m pip install -q huggingface_hub==0.29.3
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from huggingface_hub import hf_hub_download
          p = hf_hub_download(
              "bartowski/Qwen2.5-7B-Instruct-GGUF",
              "Qwen2.5-7B-Instruct-Q4_K_M.gguf",
              revision="8911e8a47f92bac19d6f5c64a2e2095bd2f7d031",
          )
          print("model_path=" + p)
          PY
      - name: Build clone and pinned offline inference runner
        run: docker build -f security_lab/Dockerfile.s0c -t infinito-security-s0c .
      - name: Execute real model and MCP clone with Docker network disabled
        env:
          MODEL_PATH: ${{ steps.gguf.outputs.model_path }}
        run: |
          set -euo pipefail
          mkdir -p s0c_artifacts
          docker run --rm \
            --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 128 --memory 6500m --cpus 4 \
            --tmpfs /tmp:rw,nosuid,size=256m,mode=1777 \
            --mount "type=bind,src=${MODEL_PATH},dst=/models/model.gguf,readonly" \
            --entrypoint /bin/sh infinito-security-s0c -c '
              python -m security_lab.s0c --out /tmp/s0c_artifacts
              exit_code=$?
              echo "S0C_JSON_REPORT_BEGIN"
              cat /tmp/s0c_artifacts/report.json 2>/dev/null || cat /tmp/s0c_artifacts/blocked.json
              echo "S0C_JSON_REPORT_END"
              exit "$exit_code"
            ' 2>&1 | tee s0c_artifacts/console.log
      - name: Extract sanitized report for review
        if: always()
        run: |
          if test -f s0c_artifacts/console.log; then
            awk '/^S0C_JSON_REPORT_BEGIN$/{f=1;next} /^S0C_JSON_REPORT_END$/{f=0} f{print}' \
              s0c_artifacts/console.log > s0c_artifacts/report.json
          fi
      - name: Upload synthetic-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infinito-s0c-frozen-7b-mcp-ablation
          path: s0c_artifacts/
          if-no-files-found: warn
          retention-days: 30
