name: INFINITO 3.0 V11 Live One-Shot

on:
  push:
    branches: [fix/v11-lossless-current-planner-20260915]
    paths:
      - '.github/infinito3-v11-live-trigger'

permissions:
  contents: read

jobs:
  v11-live:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact frozen V11 candidate
        uses: actions/checkout@v4
        with:
          ref: d8fa0b37e889529202b0102097a81b656b6cc983
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frozen direct dependencies
        run: python -m pip install openai==3.14.0 pytest==9.1.1

      - name: Verify secret is configured
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: test -n "$OPENAI_API_KEY"

      - name: V11 preflight without replay
        run: python scripts/run_infinito3_trajectory_holdout_v11.py

      - name: Execute V11 exactly once
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: >-
          python scripts/run_infinito3_trajectory_holdout_v11.py
          --authorize-live-v11
          --expected-revision d8fa0b37e889529202b0102097a81b656b6cc983
          --output-dir trajectory-holdout-v11-results

      - name: Publish report summary
        if: always() && hashFiles('trajectory-holdout-v11-results/report.md') != ''
        run: cat trajectory-holdout-v11-results/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload V11 audit evidence
        if: always() && hashFiles('trajectory-holdout-v11-results/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: infinito3-v11-live-one-shot
          path: trajectory-holdout-v11-results/
          if-no-files-found: error
          retention-days: 30
