name: INFINITO S0-J1 Qwen14B short memory-competence preflight

on:
  push:
    branches: ["experiment/s0j1-14b-competence-preflight-20261110"]
    paths:
      - "security_lab/s0j1.py"
      - "docs/INFINITO_S0J1_*"
      - ".github/workflows/infinito-s0j1-14b-competence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s0j1-14b-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install source-only test dependencies
        run: python -m pip install -q pytest "mcp>=2,<3" "cryptography>=42" "pykeepass>=4.1,<5"
      - name: Validate pre-existing S0-J0 scientific contracts and new syntax
        run: |
          python -m pytest -q tests/test_security_lab_s0j0.py
          python -m compileall -q security_lab/s0j1.py
          python - <<'PY'
          from security_lab import s0j1, s0j0
          assert s0j1.ARMS == ("N0", "N1", "N3")
          assert [x["id"] for x in s0j1.tasks()] == ["J00", "J02", "J04", "J06"]
          assert len(s0j0.tasks()) == 8
          assert len(s0j1.MODEL_REVISION) == 40
          print("SOURCE_CONTRACTS_PASS")
          PY

  qwen14b:
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        arm: ["N0", "N1", "N3"]
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch immutable 14B revision, verify bytes before inference
        id: gguf
        run: |
          python -m pip install -q huggingface_hub==0.29.3
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib
          from huggingface_hub import hf_hub_download
          path = hf_hub_download(
              "bartowski/Qwen2.5-14B-Instruct-GGUF",
              "Qwen2.5-14B-Instruct-Q4_K_M.gguf",
              revision="05244aa5d871c661c80082a15d3bce44714d068d",
          )
          sha = hashlib.sha256()
          with open(path, "rb") as stream:
              for chunk in iter(lambda: stream.read(8*1024*1024), b""):
                  sha.update(chunk)
          print("model_path=" + path)
          print("model_sha256=" + sha.hexdigest())
          PY
      - name: Build original offline OAuth/MCP test container
        run: docker build -f security_lab/Dockerfile.s0c -t infinito-s0j1-14b .
      - name: Run just four TRAIN interpretation cases
        env:
          MODEL_PATH: ${{ steps.gguf.outputs.model_path }}
          GGUF_SHA256: ${{ steps.gguf.outputs.model_sha256 }}
          ARM: ${{ matrix.arm }}
        run: |
          set -euo pipefail
          mkdir -p result
          docker run --rm \
            --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 128 --memory 12500m --cpus 4 \
            --tmpfs /tmp:rw,nosuid,size=256m,mode=1777 \
            --mount "type=bind,src=${MODEL_PATH},dst=/models/model.gguf,readonly" \
            -e GGUF_SHA256 -e ARM \
            --entrypoint /bin/sh infinito-s0j1-14b -c '
              python -m security_lab.s0j1 arm --arm "$ARM" --out /tmp/s0j1/report.json
              rc=$?
              echo S0J1_REPORT_BEGIN
              cat /tmp/s0j1/report.json 2>/dev/null || cat /tmp/s0j1/blocked.json 2>/dev/null
              echo S0J1_REPORT_END
              exit "$rc"
            ' 2>&1 | tee result/console.log
      - name: Extract real raw outputs and evidence
        if: always()
        run: |
          if test -f result/console.log; then
            awk '/^S0J1_REPORT_BEGIN$/{f=1;next} /^S0J1_REPORT_END$/{f=0} f{print}' \
              result/console.log > result/report.json
          fi
      - name: Archive all real outputs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s0j1-14b-reading-${{ matrix.arm }}
          path: result/report.json
          retention-days: 30

  aggregate:
    needs: [contracts, qwen14b]
    if: always() && needs.contracts.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install scoring dependencies
        run: python -m pip install -q "mcp>=2,<3" "cryptography>=42" "pykeepass>=4.1,<5"
      - uses: actions/download-artifact@v4
        with:
          pattern: s0j1-14b-reading-*
          path: reading_parts
      - name: Aggregate 12 real outputs without JSON rescue
        run: |
          mkdir -p report
          python -m security_lab.s0j1 aggregate \
            --inputs reading_parts --out report/competence.json
      - name: Preserve final scientific audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s0j1-14b-competence-audit
          path: report/
          retention-days: 30
