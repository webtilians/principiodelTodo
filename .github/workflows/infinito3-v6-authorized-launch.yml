name: INFINITO 3.0 Authorized First V6
on:
  push:
    branches: [eval/v6-first-live-20260915]
permissions:
  contents: read
concurrency:
  group: infinito3-first-frozen-v6
  cancel-in-progress: false
jobs:
  first-v6:
    if: github.event.created == true && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a2388ce0ddfd4659356b436ec937c9935f4e6e2c
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen direct dependencies
        run: python -m pip install openai==3.14.0 pytest==9.1.1
      - name: Deterministic tests and freeze preflight
        run: |
          python -m pytest -q tests/*_v3.py --disable-warnings
          python scripts/run_infinito3_trajectory_holdout_v6.py
      - name: Single authorized live V6
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: >-
          python scripts/run_infinito3_trajectory_holdout_v6.py
          --authorize-live-v6
          --expected-revision a2388ce0ddfd4659356b436ec937c9935f4e6e2c
          --output-dir trajectory-holdout-v6-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infinito3-first-v6-${{ github.run_id }}-${{ github.run_attempt }}
          path: trajectory-holdout-v6-results/
          if-no-files-found: warn
          retention-days: 30
