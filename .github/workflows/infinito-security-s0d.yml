name: INFINITO Security S0-D evidence recognition versus memory selection

on:
  push:
    branches: ["experiment/security-s0d-evidence-selection-20261109"]
    paths:
      - "security_lab/s0d.py"
      - "tests/test_security_lab_s0d.py"
      - "docs/INFINITO_SECURITY_S0D_*"
      - ".github/workflows/infinito-security-s0d.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s0d-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install non-LLM contract test dependencies
        run: python -m pip install -q pytest "cryptography>=42"
      - name: Verify prospective splits, grader, and SQLite evidence with pytest
        run: python -m pytest tests/test_security_lab_s0d.py -q
      - name: Verify source syntax
        run: python -m compileall -q security_lab/s0d.py

  inference:
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download public frozen Qwen7B GGUF into disposable runner
        id: gguf
        run: |
          python -m pip install -q huggingface_hub==0.29.3
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from huggingface_hub import hf_hub_download
          p = hf_hub_download(
              "bartowski/Qwen2.5-7B-Instruct-GGUF",
              "Qwen2.5-7B-Instruct-Q4_K_M.gguf",
              revision="8911e8a47f92bac19d6f5c64a2e2095bd2f7d031",
          )
          print("model_path=" + p)
          PY
      - name: Build read-only cloned MCP inference container
        run: docker build -f security_lab/Dockerfile.s0c -t infinito-security-s0d .
      - name: Run S0-D on localhost MCP with absolutely no external networking
        env:
          MODEL_PATH: ${{ steps.gguf.outputs.model_path }}
        run: |
          set -euo pipefail
          mkdir -p s0d_artifacts
          docker run --rm \
            --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 128 --memory 6500m --cpus 4 \
            --tmpfs /tmp:rw,nosuid,size=256m,mode=1777 \
            --mount "type=bind,src=${MODEL_PATH},dst=/models/model.gguf,readonly" \
            --entrypoint /bin/sh infinito-security-s0d -c '
              python -m security_lab.s0d --out /tmp/s0d_artifacts
              code=$?
              echo S0D_JSON_REPORT_BEGIN
              cat /tmp/s0d_artifacts/report.json 2>/dev/null || cat /tmp/s0d_artifacts/blocked.json
              echo S0D_JSON_REPORT_END
              exit "$code"
            ' 2>&1 | tee s0d_artifacts/console.log
      - name: Extract synthetic-only evidence from console log
        if: always()
        run: |
          if test -f s0d_artifacts/console.log; then
            awk '/^S0D_JSON_REPORT_BEGIN$/{f=1;next} /^S0D_JSON_REPORT_END$/{f=0} f{print}' \
              s0d_artifacts/console.log > s0d_artifacts/report.json
          fi
      - name: Upload results without OAuth tokens or memory content
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infinito-security-s0d-real-7b
          path: s0d_artifacts/
          retention-days: 30
          if-no-files-found: warn
