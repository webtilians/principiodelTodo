name: INFINITO V5.1 Memory Feedback

on:
  push:
    branches: ["experiment/emergence-observatory-*"]
    paths:
      - "scripts/infinito_v51_memory_feedback.py"
      - ".github/workflows/infinito-v51-memory-feedback.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controlled-recall:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install historic V5.1 runtime
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy scipy matplotlib sympy pygame
      - name: Short delay with four parallel controls
        run: |
          PYTHONPATH=. python scripts/infinito_v51_memory_feedback.py \
            --seeds 11 29 47 --train 24 --test 24 --gain 0.5 \
            --steps 5 --distractor-sd 0.12 \
            --output observatory_results/memory_feedback/short
      - name: Longer delay and stronger distractors
        run: |
          PYTHONPATH=. python scripts/infinito_v51_memory_feedback.py \
            --seeds 11 29 47 --train 16 --test 16 --gain 0.5 \
            --steps 17 --distractor-sd 0.55 \
            --output observatory_results/memory_feedback/long
      - name: Inspect result schema and report controls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for label in ("short", "long"):
              p = Path(f"observatory_results/memory_feedback/{label}/report.json")
              d = json.loads(p.read_text())
              assert len(d["results"]) == 3
              assert set(d["mean_accuracy"]) == {
                  "historical", "historical_memory_cut",
                  "early_feedback", "early_feedback_memory_cut"
              }
              print("PROTOCOL", label, d["protocol"])
              print("MEAN ACCURACY:", json.dumps(d["mean_accuracy"], sort_keys=True))
              for r in d["results"]:
                  print("SEED:", label, r["seed"])
                  for k, v in r["comparisons"].items():
                      print(" ", k, json.dumps(v))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infinito-v51-memory-feedback-with-interference
          path: observatory_results/memory_feedback/**/report.json
          if-no-files-found: warn
