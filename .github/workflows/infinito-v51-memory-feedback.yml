name: INFINITO V5.1 Memory Feedback

on:
  push:
    branches: ["experiment/emergence-observatory-*"]
    paths:
      - "scripts/infinito_v51_memory_feedback.py"
      - ".github/workflows/infinito-v51-memory-feedback.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controlled-recall:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install historic V5.1 runtime
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy scipy matplotlib sympy pygame
      - name: Repeated controlled delayed-cue test
        run: |
          PYTHONPATH=. python scripts/infinito_v51_memory_feedback.py \
            --seeds 11 29 47 --train 24 --test 24 --gain 0.5 \
            --output observatory_results/memory_feedback
      - name: Inspect result schema and print findings
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("observatory_results/memory_feedback/report.json")
          d = json.loads(p.read_text())
          assert len(d["results"]) == 3
          assert set(d["mean_accuracy"]) == {
              "historical", "early_feedback", "early_feedback_memory_cut"
          }
          print("MEAN ACCURACY:", json.dumps(d["mean_accuracy"], sort_keys=True))
          for r in d["results"]:
              print("SEED:", r["seed"])
              for k, v in r["comparisons"].items():
                  print(" ", k, json.dumps(v))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infinito-v51-memory-feedback-experiment
          path: observatory_results/memory_feedback/report.json
          if-no-files-found: warn
