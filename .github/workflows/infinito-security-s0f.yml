name: INFINITO Security S0-F server-signed OAuth MCP provenance

on:
  push:
    branches: ["experiment/security-s0f-server-provenance-20261109"]
    paths:
      - "src/infinito3/remote_provenance.py"
      - "src/infinito3/remote.py"
      - "tests/test_security_lab_s0f.py"
      - "docs/INFINITO_SECURITY_S0F_*"
      - ".github/workflows/infinito-security-s0f.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s0f-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline_e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify syntax before building isolated container
        run: python -m compileall -q src/infinito3/remote.py src/infinito3/remote_provenance.py tests/test_security_lab_s0f.py
      - name: Build isolated real OAuth MCP clone and regression tests
        run: docker build -f security_lab/Dockerfile.s0b -t infinito-security-s0f .
      - name: Execute new K00-K15 E2E and previous S0-A to S0-E regression gates OFFLINE
        run: |
          docker run --rm \
            --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 128 --memory 1400m --cpus 2 \
            --tmpfs /tmp:rw,nosuid,size=256m,mode=1777 \
            -e HOME=/tmp \
            --entrypoint python infinito-security-s0f -m pytest -p no:cacheprovider -q \
            tests/test_security_lab_s0.py \
            tests/test_security_lab_s0b.py \
            tests/test_security_lab_s0c.py \
            tests/test_security_lab_s0d.py \
            tests/test_security_lab_s0e.py \
            tests/test_security_lab_s0f.py
      - name: Verify integration with the current signed-in MCP feature set
        run: |
          docker run --rm \
            --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 128 --memory 1400m --cpus 2 \
            --tmpfs /tmp:rw,nosuid,size=256m,mode=1777 \
            -e HOME=/tmp \
            --entrypoint python infinito-security-s0f -m pytest -p no:cacheprovider -q \
            tests/test_remote_accounts_v3.py
