name: INFINITO development embeddings

# Embeddings only (text-embedding-3-small, a few cents), so that context
# selection and forgetting can be calibrated offline on development data.
# Only a change to the launch file on this branch starts it.
on:
  push:
    branches: [feat/v0.5-forgetting]
    paths: [".github/launch/embeddings-fetch.txt"]

permissions:
  contents: read

concurrency:
  group: infinito-embeddings-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the OpenAI SDK and NumPy
        run: python -m pip install 'openai>=1.55,<4' 'numpy>=1.26' pytest
      - name: Core tests, no API calls
        run: python -m pytest -q tests/test_*v3.py
      - name: Bemula at the released commit
        run: |
          git clone --quiet https://github.com/Nboxff/bemula-benchmark.git ../bemula
          git -C ../bemula checkout --quiet 862aff6be384
      - name: Require the API key without printing it
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY is not set"
            exit 3
          fi
      - name: Embed the development texts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/fetch_embeddings.py --bemula ../bemula --out results/dev-embeddings
      - uses: actions/upload-artifact@v4
        with:
          name: dev-embeddings
          path: results/
          retention-days: 30
