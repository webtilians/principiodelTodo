name: MCP connection wizard integration

on:
  pull_request:
    branches: ["master"]
    paths:
      - "src/infinito3/remote.py"
      - "src/infinito3/remote_accounts.py"
      - "src/infinito3/remote_connect.py"
      - "src/infinito3/remote_installer.py"
      - "tests/test_remote_connect_v3.py"
      - "tests/test_remote_accounts_v3.py"
      - ".github/workflows/mcp-connection-wizard.yml"

permissions:
  contents: read

jobs:
  onboarding:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install MCP, OAuth and HTTP test dependencies
        run: |
          python -m pip install -q pytest "mcp>=2,<3" "cryptography>=42" "pykeepass>=4.1,<5"
      - name: Run onboarding and real HTTP/OAuth integration tests
        run: |
          python - <<'PY'
          import mcp.server.mcpserver, httpx2, starlette, uvicorn, cryptography
          print("MCP+HTTP+crypto dependencies available")
          PY
          python -m pytest -q tests/test_remote_connect_v3.py tests/test_remote_accounts_v3.py
