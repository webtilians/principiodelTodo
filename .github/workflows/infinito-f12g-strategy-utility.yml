name: INFINITO F12-G — verified strategy utility against episodic RAG

on:
  push:
    branches:
      - experiment/f12g-verified-strategy-utility-20261106
    paths:
      - 'observatory/f12g_verified_strategy_utility.py'
      - 'tests/test_f12g_verified_strategy_utility.py'
      - '.github/workflows/infinito-f12g-strategy-utility.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Strong baseline, strict tracing, split isolation and no fake success
        run: python -m unittest tests.test_f12g_verified_strategy_utility -v

  real-frozen-7b-pilot:
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONHASHSEED: "0"
      HF_HUB_DISABLE_TELEMETRY: "1"
      OMP_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned frozen Qwen7B CPU inference backend
        run: |
          python -m pip install --disable-pip-version-check --only-binary llama-cpp-python \
            --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu \
            llama-cpp-python==0.3.36 huggingface_hub==0.29.3
      - name: Run observed TRAIN and 60 paired A0/A1/A2/A3/A4 heldout episodes
        run: |
          python -m observatory.f12g_verified_strategy_utility --out f12g_verified_utility_artifacts
      - name: Preserve raw tool trajectories, actual contexts, observed source claims and inference costs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f12g-real7b-verified-vs-episodic-utility
          path: f12g_verified_utility_artifacts/
          if-no-files-found: warn
          retention-days: 30
