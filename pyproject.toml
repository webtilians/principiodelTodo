[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infinito-memory"
version = "0.7.0"
description = "Privacy-first long-term memory layer for LLM assistants, with a preregistered evaluation lab."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "enrikelr" }]
keywords = ["llm", "memory", "rag", "agents", "evaluation", "privacy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The core uses only the standard library.
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.40"]
# cryptography seals each person's memory on the remote server (remote.py).
mcp = ["mcp>=2,<3", "cryptography>=42"]
# The agent's vault: secrets in a KeePass file, shown only on the user's screen.
vault = ["pykeepass>=4.1,<5"]
# The remote server finds memories by meaning (semantic.py), with a model kept in INFINITO_EMBEDDINGS.
# Saving that model once (python -m infinito3.semantic save) also needs model2vec.
semantic = ["numpy>=1.24"]
dev = ["pytest>=8"]

[project.scripts]
# Long-term memory for AI agents over MCP; needs the mcp extra.
infinito-mcp = "infinito3.mcp_server:main"
# The same memory over HTTP, one per person and sealed, shared by all of that person's agents.
infinito-remote = "infinito3.remote:main"

[project.urls]
Repository = "https://github.com/webtilians/principiodelTodo"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["infinito3"]

[tool.setuptools.package-data]
infinito3 = ["assets/*"]
