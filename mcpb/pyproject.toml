# Dependencies of the Claude Desktop extension; the host runs it with uv, so users install nothing.
# The INFINITO core is copied into server/infinito3 by mcpb/build.py.
[project]
name = "infinito-memory-extension"
version = "0.7.0"
requires-python = ">=3.10"
dependencies = ["mcp>=2,<3", "pykeepass>=4.1,<5"]

[tool.uv]
package = false
